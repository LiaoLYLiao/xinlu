   case"mapmode":mapMode=t.dataset.m;render();break;
   case"journey":view="map";mapMode="journey";local.set("xinlu-view","map");render();window.scrollTo(0,0);break;
   case"zoom":zoomAt(+t.dataset.z);break;
   case"examples":await loadExamples();break;
   case"clear-ex":await clearExamples();break;
   case"export":doExport();break;
   case"import":$("#importFile")?.click();break;
   case"do-import":t.disabled=true;await runImport();break;
   case"copy-json":{const ta=$("#sheetRoot textarea");try{await navigator.clipboard.writeText(ta.value);toast("已複製")}catch(e){ta.select()}break}
   case"migrate":await migrate();break;
   case"ask":{const e=clone(S.entries.get(id));if(!e)break;e.asked=e.asked||{};e.asked[t.dataset.i]=t.checked;await put("entries",e);break}
   case"tstatus":{const th=clone(S.themes.get(id));if(!th)break;th.status=t.dataset.s;await put("themes",th);break}
   case"rename-theme":{const th=clone(S.themes.get(id));const v=$("#th-name").value.trim();if(th&&v){th.name=v;await put("themes",th);toast("已改名")}break}
   case"note-theme":{const th=clone(S.themes.get(id));if(th){th.note=$("#th-note").value;await put("themes",th);toast("已儲存")}break}
   case"ask-del":sheet.confirmDel=true;drawSheet();break;
   case"cancel-del":sheet.confirmDel=false;drawSheet();break;
   case"us-add":{const v=($("#us-new").value||"").trim();if(!v){toast("先寫下那句話");break}await updPerson(q=>q.unsaid.push({id:uid(),text:v,said:false,at:Date.now()}));drawSheet();break}
   case"us-del":await updPerson(q=>{q.unsaid=q.unsaid.filter(u=>u.id!==t.dataset.uid)});drawSheet();break;
   case"us-said":capturePD();sheet.saying=t.dataset.uid;drawSheet();$("#us-react")?.focus();break;
   case"us-cancel":capturePD();sheet.saying=null;drawSheet();break;
   case"us-confirm":{const r=($("#us-react").value||"").trim();sheet.saying=null;await updPerson(q=>{const u=q.unsaid.find(x=>x.id===t.dataset.uid);if(u){u.said=true;u.saidAt=today();u.reaction=r}});drawSheet();toast("說出口了，這是很大的一步。");break}
   case"new-letter":{capturePD();const pp=S.people.get(id);if(!pp)break;openSheet({kind:"edit",draft:Object.assign(newDraft("letter"),{to:id,people:[id],text:`給${pp.name}：\n\n`})});break}
   case"tear":{const text=sheet.draft.text,eid=sheet.id;sheet.newMedia=[];sheet.dirty=false;closeSheet();tearRitual(text,async()=>{if(eid&&S.entries.get(eid))await del("entries",eid);toast("這件事，可以結束了")});break}
   case"tear-entry":{const en=S.entries.get(id);if(!en)break;closeSheet();tearRitual(en.text,async()=>{(en.media||[]).forEach(delMedia);await del("entries",id);toast("這件事，可以結束了")});break}
   case"letter-ana":sheet.letterAna=true;drawSheet();break;
   case"open-quotes":openSheet({kind:"quotes"});break;
   case"q-keep":{const q=clone(S.quotes.get(id));if(q){q.status="kept";await put("quotes",q)}drawSheet();break}
   case"q-del":await del("quotes",id);drawSheet();break;
   case"q-add":{const v=($("#q-new").value||"").trim();if(!v){toast("先寫下那句話");break}await put("quotes",{id:uid(),text:v,status:"kept",date:today(),createdAt:Date.now()});drawSheet();toast("收藏了");break}
   case"fab-quote":{const en=sheet&&S.entries.get(sheet.id);if(!quoteSel||!en)break;await put("quotes",{id:uid(),text:quoteSel,entryId:en.id,date:en.date,status:"kept",createdAt:Date.now()});try{getSelection().removeAllRanges()}catch(e){}$("#quoteFab").hidden=true;toast("收藏了");break}
   case"open-prep":openSheet({kind:"prep"});break;
   case"myq-add":{const v=($("#pr-q").value||"").trim();if(!v){toast("先寫下問題");break}await savePrep(p=>{(p.myQs=p.myQs||[]).push({id:uid(),text:v,done:false})});drawSheet();break}
   case"myq-done":await savePrep(p=>{const q=(p.myQs||[]).find(x=>x.id===t.dataset.qid);if(q)q.done=t.checked});drawSheet();break;
   case"myq-del":await savePrep(p=>{p.myQs=(p.myQs||[]).filter(x=>x.id!==t.dataset.qid)});drawSheet();break;
   case"prep-drop":await savePrep(p=>{if((p.picked||[]).includes(id))p.picked=p.picked.filter(x=>x!==id);else(p.dropped=p.dropped||[]).push(id)});drawSheet();break;
   case"prep-sum":prepSummary();break;
   case"prep-session":{const {pr,qs}=prepData();const qsx=[...qs.filter(x=>!x.done).map(x=>x.q),...(pr.myQs||[]).filter(x=>!x.done).map(x=>x.text)];
     const pre=[pr.focus?`【這次想談的】\n${pr.focus}`:"",qsx.length?`【想問的問題】\n${qsx.map(q=>"・"+q).join("\n")}`:"",pr.hwNote?`【回家作業】\n${pr.hwDone?"做了。":"還沒做。"}${pr.hwNote}`:""].filter(Boolean).join("\n\n");
     openSheet({kind:"edit",draft:Object.assign(newDraft("session"),{talk:pre?pre+"\n\n【今天談了】\n":"",fromPrep:true})});break}
   case"settings":openSheet({kind:"settings"});break;
   case"set-mode":{const st=settings();st.aiMode=t.dataset.m;saveSettings(st);drawSheet();break}
   case"save-key":{const st=settings();st.provider=$("#st-prov").value;st.remember=$("#st-remember").checked;st.preview=$("#st-preview").checked;st.models=st.models||{};st.models[st.provider]=($("#st-model").value||"").trim()||PROVIDERS[st.provider].model;saveSettings(st);setKey(st.provider,($("#st-key").value||"").trim(),st.remember);toast(st.remember?"已儲存在這台裝置":"已設定，關閉網頁後需要重新輸入");drawSheet();break}
   case"clear-key":{const st=settings();setKey(st.provider,"",false);delete memKeys[st.provider];toast("金鑰已刪除");drawSheet();break}
   case"save-mask":{const st=settings();st.maskWords=$("#st-mask").value;saveSettings(st);toast("已儲存");break}
   case"wipe":sheet.confirmWipe=true;drawSheet();break;
   case"wipe-no":sheet.confirmWipe=false;drawSheet();break;
   case"wipe-yes":await wipeAll();break;
   case"install":if(installEvt){installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;schedule()})}break;
   case"welcome-ok":local.set("xinlu-welcomed",true);closeSheet();break;
   case"welcome-ex":local.set("xinlu-welcomed",true);closeSheet();await loadExamples();break;
   case"open-assistant":openSheet({kind:"assistant"});break;
   case"copy-assist":{const txt=assistantPrompt();try{await navigator.clipboard.writeText(txt);toast("已複製助手指示")}catch(e){toast("複製失敗，請展開下方內容手動複製")}break}
   case"dl-knowledge":downloadText("心路方法庫與研究庫.md",knowledgeMD(),"text/markdown");break;
   case"paste-chat":openSheet({kind:"pastechat"});break;
   case"pc-save":await savePastedChat();break;
   case"ai-copy":{const q=jobById(aiOpen);if(!q)break;try{await navigator.clipboard.writeText(q.text);toast("已複製，去你的 AI 貼上吧")}catch(e){const pre=$("#aiRoot details");if(pre)pre.open=true;toast("複製失敗，請長按下方內容手動複製")}break}
   case"ai-later":closeAI();if(sheet&&sheet.kind!=="edit")drawSheet();break;
   case"open-job":openJob(id);break;
   case"job-run":runJob(id);break;
   case"job-del":cancelJob(id);break;
   case"open-jobs":openSheet({kind:"jobs"});break;
   case"ai-done":{const q=jobById(aiOpen);if(!q)break;const v=$("#ai-paste").value;q.draft=v;if(!v.trim()){q.err="請先貼上 AI 的回覆。";drawAI();break}t.disabled=true;t.textContent="讀取中……";try{await completeJob(q.id,v)}catch(e){}break}
   case"ai-switch-copy":{const q=jobById(aiOpen);if(q){q.copy=true;q.err="";saveJobs();drawAI()}break}
   case"pick-photo":$("#f-photo")?.click();break;
   case"pick-audio":$("#f-audio")?.click();break;
   case"rm-media":{const d=sheet.draft;const m=(d.media||[]).find(x=>x.id===t.dataset.mid);if(!m)break;d.media=d.media.filter(x=>x!==m);sheet.dirty=true;
     if((sheet.newMedia||[]).includes(m)){sheet.newMedia=sheet.newMedia.filter(x=>x!==m);delMedia(m)}else(sheet.removed=sheet.removed||[]).push(m);renderDraftMedia();break}
   case"view-photo":viewPhoto(t.dataset.mid);break;
   case"close-photo":$("#photoRoot").innerHTML="";break;
   case"del-entry":{const en=S.entries.get(id);(en&&en.media||[]).forEach(delMedia)}for(const s of steps().filter(s=>s.entryId===id))await del("steps",s.id);await del("entries",id);closeSheet();toast("已刪除");break;
   case"del-person":{for(const e of entriesOfPerson(id)){const c=clone(e);c.people=c.people.filter(x=>x!==id);await put("entries",c)}await del("people",id);closeSheet();toast("已刪除");break}
   case"del-theme":{for(const e of entriesOfTheme(id)){const c=clone(e);c.themes=c.themes.filter(x=>x!==id);await put("entries",c)}await del("themes",id);closeSheet();toast("已刪除");break}
   case"analyze":await analyze(id);break;
   case"apply":await applyAnalysis(id);break;
   case"pick-step":openSheet({kind:"method",id:t.dataset.m,entryId:t.dataset.e});break;
   case"add-step":{const st={id:uid(),methodId:t.dataset.m,entryId:$("#st-entry").value||"",note:$("#st-note").value.trim(),status:"todo",createdAt:Date.now()};await put("steps",st);closeSheet();toast("已放進「我的下一步」");break}
   case"done-step":openSheet({kind:"done",id,help:0,ref:""});break;
   case"help-v":sheet.help=+t.dataset.v;sheet.ref=$("#dn-ref").value;drawSheet();break;
   case"finish-step":{const s=clone(S.steps.get(id));if(!s)break;s.status="done";s.help=sheet.help||0;s.reflection=$("#dn-ref").value.trim();s.doneAt=Date.now();await put("steps",s);closeSheet();toast("記下來了。做到了，就是往前一步。");break}
   /* editor */
   case"etype":sheet.draft.type=t.dataset.t;if(t.dataset.t==="session"&&!sheet.draft.no)sheet.draft.no=Math.max(0,...sessions().map(s=>+s.no||0))+1;sheet.dirty=true;drawSheet();break;
   case"emood":sheet.draft.mood=sheet.draft.mood===+t.dataset.v?0:+t.dataset.v;sheet.dirty=true;$$("[data-act=emood]").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.v===sheet.draft.mood));break;
   case"estage":sheet.draft.stage=sheet.draft.stage===t.dataset.s?"":t.dataset.s;sheet.dirty=true;$$("[data-act=estage]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.s===sheet.draft.stage));break;
   case"eperson":{const l=sheet.draft.people=sheet.draft.people||[];const i=l.indexOf(id);i>=0?l.splice(i,1):l.push(id);sheet.dirty=true;t.setAttribute("aria-pressed",i<0);break}
   case"eaddp":{const n=$("#np-name").value.trim();if(!n){toast("請先輸入名字或稱呼");break}
     let p=people().find(x=>x.name===n);if(!p){p={id:uid(),name:n,relation:"",stages:sheet.draft.stage?[sheet.draft.stage]:[],feeling:"",createdAt:Date.now()};await put("people",p)}
     (sheet.draft.people=sheet.draft.people||[]).includes(p.id)||sheet.draft.people.push(p.id);sheet.dirty=true;
     $("#ppick").innerHTML=people().map(q=>`<button type="button" class="pick p" data-act="eperson" data-id="${q.id}" aria-pressed="${sheet.draft.people.includes(q.id)}">${esc(q.name)}</button>`).join("");
     $("#np-name").value="";$("#np-name").focus();break}
   case"apply-all":{const e=S.entries.get(id);if(e&&e.analysis){await applyCore(id,e.analysis.people.map((_,i)=>i),e.analysis.themes.map((_,i)=>i));toast("已連到地圖")}break}
   case"unlink":{const e=clone(S.entries.get(id));if(!e)break;e[t.dataset.k]=(e[t.dataset.k]||[]).filter(x=>x!==t.dataset.v);await put("entries",e);break}
   case"discard":closeSheet();break;
   case"keep":sheet.confirmClose=false;drawSheet();break;
   case"unsel":selNode=null;highlight();renderPanel();break;
   case"save":{const d=sheet.draft;const content=d.type==="session"?(d.talk||d.said||d.insight||d.homework||d.next):d.text;
     if(!String(content||"").trim()&&!(d.media||[]).length){toast("先寫一點內容，或加入照片、錄音再儲存");break}
     if(dict&&dict.active())await dict.stop().catch(()=>{});
     const old=sheet.id?S.entries.get(sheet.id):null;
     const e=Object.assign({},old?clone(old):{id:uid(),createdAt:Date.now(),themes:[],asked:{}},clone(d));
     if(!e.date)e.date=today();const fromPrep=e.fromPrep;delete e.fromPrep;await put("entries",e);
     if(fromPrep)await put("meta",{id:"prep"});
     for(const m of sheet.removed||[])delMedia(m);sheet.newMedia=[];
     const then=t.dataset.then;sheet={kind:"entry",id:e.id};drawSheet();toast("已儲存");if(then==="analyze")analyze(e.id);break}
   /* person sheet */
   case"pp-stage":{capturePD();const d=sheet.pd;const l=d.stages=d.stages||[];const i=l.indexOf(t.dataset.s);i>=0?l.splice(i,1):l.push(t.dataset.s);drawSheet();break}
   case"save-person":{capturePD();const d=sheet.pd;d.name=d.name.trim();d.relation=(d.relation||"").trim();if(!d.name){toast("請輸入名字或稱呼");break}const curP=d.id&&S.people.get(d.id);if(curP)d.unsaid=curP.unsaid||[];
     if(!d.id){d.id=uid();d.createdAt=Date.now()}await put("people",clone(d));sheet={kind:"person",id:d.id};drawSheet();toast("已儲存");break}
  }
});
document.addEventListener("click",ev=>{const b=ev.target.closest("[data-mic]");if(!b||!dict)return;
  bindMic();
  if(dict.active()&&micTarget===b.dataset.mic){dict.stop().catch(()=>{});return}
  micTarget=b.dataset.mic;
  dict.start().catch(e=>{if(e&&e.code==="not_granted")toast("口述沒有開啟。可以在這個頁面的權限選單裡打開。");else if(e&&e.code==="unavailable")$$(".mic").forEach(x=>x.hidden=true);else if(e&&e.code!=="stopped"&&e.code!=="dismissed")toast("口述暫時無法使用，請改用打字。")})});
document.addEventListener("input",ev=>{if(ev.target.id==="ai-paste"){const q=jobById(aiOpen);if(q)q.draft=ev.target.value}if(ev.target.id==="logq"){logQuery=ev.target.value;clearTimeout(vLog.t);vLog.t=setTimeout(()=>{const pos=ev.target.selectionStart;render();const q=$("#logq");if(q){q.focus();try{q.setSelectionRange(pos,pos)}catch(e){}}},250)}});
document.addEventListener("change",ev=>{
  if(ev.target.id==="showE"){showEntries=ev.target.checked;selNode=null;render()}
  if(ev.target.id==="importFile"&&ev.target.files[0]){doImport(ev.target.files[0]);ev.target.value=""}
  if(ev.target.id==="imp-files"&&ev.target.files.length){onImportFiles([...ev.target.files])}
  if((ev.target.id==="f-photo"||ev.target.id==="f-audio")&&ev.target.files.length){const fs=[...ev.target.files];ev.target.value="";addFiles(fs,ev.target.id==="f-photo"?"image":"audio")}
  if(ev.target.dataset&&ev.target.dataset.impDate!==undefined&&sheet&&sheet.items){sheet.items[+ev.target.dataset.impDate].date=ev.target.value}
  if(ev.target.id==="rv-pick"){reviewSel=ev.target.value;render()}
  const pv=ev.target.id;
  if(pv==="pr-date")savePrep(p=>{p.nextDate=ev.target.value});
  if(pv==="pr-hw")savePrep(p=>{p.hwDone=ev.target.checked});
  if(pv==="pr-hwnote")savePrep(p=>{p.hwNote=ev.target.value});
  if(pv==="pr-focus")savePrep(p=>{p.focus=ev.target.value});
  if(pv==="pr-add"&&ev.target.value){const v=ev.target.value;savePrep(p=>{(p.picked=p.picked||[]).includes(v)||p.picked.push(v);p.dropped=(p.dropped||[]).filter(x=>x!==v)}).then(()=>drawSheet())}});
document.addEventListener("keydown",ev=>{if(ev.key==="Enter"&&!ev.isComposing){const m={"np-name":"eaddp","us-new":"us-add","pr-q":"myq-add","us-react":"us-confirm"}[ev.target.id];if(m){ev.preventDefault();$(`#sheetRoot [data-act=${m}]`)?.click()}}});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&$("#photoRoot").innerHTML){$("#photoRoot").innerHTML="";return}if(ev.key==="Escape"&&sheet&&!(sheet.kind==="edit"&&sheet.dirty))closeSheet()});
let rz=0;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(view==="map"&&mapMode==="net")mountGraph()},200)});

render();boot();
})();
</script>
</body>
