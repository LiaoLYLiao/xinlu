<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api.openai.com https://api.anthropic.com https://generativelanguage.googleapis.com; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>心路</title>
<meta name="description" content="每天寫一點，看見自己心裡反覆發生的事。資料只存在你的裝置，用你自己的 AI 整理。">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F1F2F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11131B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="心路">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
/* Layout: a private notebook that grows a map. Top bar + five views (phone: bottom tabs); details and the editor open as a sheet.
   Node types carry fixed hues everywhere: people = rose, themes = indigo ink, methods = teal, records = slate. */
:root{
  --bg:#F1F2F0; --surface:#FAFAF9; --raise:#FFFFFF;
  --ink:#1D2130; --muted:#616677; --line:#DADCE0;
  --accent:#3D4B9A; --accent-soft:#E4E7F5; --on-accent:#FFFFFF;
  --person:#B4574F; --person-soft:#F6E3E0;
  --theme:#3D4B9A; --theme-soft:#E4E7F5;
  --method:#2B776D; --method-soft:#DCEFEA;
  --entry:#858A9C;
  --warn:#A8423A; --warn-soft:#F7E3E0;
  --ok:#3F7D4E; --ok-soft:#E1F0E4;
  --m1:#7A6FA8; --m2:#6F8DB5; --m3:#9AA0A8; --m4:#7DAE8E; --m5:#D3A24B;
  --shadow:0 1px 2px rgba(29,33,48,.05),0 8px 28px rgba(29,33,48,.07);
  --f-display:"Noto Serif TC","Noto Serif CJK TC","Songti TC","PMingLiU",serif;
  --f-body:"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",system-ui,sans-serif;
  --r:16px; --tab-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11131B; --surface:#171A24; --raise:#1D2130;
  --ink:#E6E8F0; --muted:#9AA0B4; --line:#2A2F3E;
  --accent:#9DA9F0; --accent-soft:#252B49; --on-accent:#11131B;
  --person:#E8998F; --person-soft:#3A2725;
  --theme:#9DA9F0; --theme-soft:#252B49;
  --method:#7BCBBE; --method-soft:#1B3531;
  --entry:#7D8396;
  --warn:#F2A196; --warn-soft:#3B2422;
  --ok:#8FCB9B; --ok-soft:#1D3323;
  --m1:#A99BE0; --m2:#94B3DE; --m3:#A3A8B2; --m4:#9DCFAD; --m5:#E9C27A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.28); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11131B; --surface:#171A24; --raise:#1D2130;
  --ink:#E6E8F0; --muted:#9AA0B4; --line:#2A2F3E;
  --accent:#9DA9F0; --accent-soft:#252B49; --on-accent:#11131B;
  --person:#E8998F; --person-soft:#3A2725;
  --theme:#9DA9F0; --theme-soft:#252B49;
  --method:#7BCBBE; --method-soft:#1B3531;
  --entry:#7D8396;
  --warn:#F2A196; --warn-soft:#3B2422;
  --ok:#8FCB9B; --ok-soft:#1D3323;
  --m1:#A99BE0; --m2:#94B3DE; --m3:#A3A8B2; --m4:#9DCFAD; --m5:#E9C27A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.28); color-scheme:dark}

*{box-sizing:border-box}
html{color-scheme:light;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(var(--tab-h) + 28px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.35;margin:0;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.shell{max-width:980px;margin:0 auto}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiny{font-size:12px}
.label{font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:500}
.stack{display:grid;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px))}
.bar-in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:22px;font-weight:700;text-decoration:none;color:var(--ink)}
.brand svg{width:28px;height:28px}
.topnav{display:flex;gap:2px;margin-left:12px}
.topnav button{border:0;background:none;padding:6px 14px;border-radius:999px;color:var(--muted);cursor:pointer;font-size:15px}
.topnav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:500}
.about-btn{margin-left:auto;border:0;background:none;color:var(--muted);cursor:pointer;font-size:14px;padding:4px 8px;border-radius:999px}
.about-btn[aria-current="page"]{color:var(--accent)}
.bar .sos{border:1px solid var(--warn);color:var(--warn);background:transparent;border-radius:999px;padding:4px 14px;font-size:14px;cursor:pointer}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:none;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px))}
.tabs-in{display:grid;grid-template-columns:repeat(5,1fr);max-width:520px;margin:0 auto}
.tabs button{border:0;background:none;display:grid;justify-items:center;gap:2px;color:var(--muted);font-size:11px;padding:4px 0;cursor:pointer}
.tabs svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--accent)}
@media (max-width:760px){.topnav{display:none}.tabs{display:block}}
@media (min-width:761px){body{padding-bottom:56px}}

/* generic */
.view{padding-top:18px;display:grid;gap:26px}
.head{display:grid;gap:4px}
.head h1{font-size:clamp(28px,6vw,38px)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;cursor:pointer;background:var(--accent);color:var(--on-accent);
  padding:9px 20px;border-radius:999px;font-size:15px;font-weight:500;text-decoration:none;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.btn.quiet{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:transparent;color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn)}
.btn.sm{padding:5px 14px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:default}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 12px;font-size:13px;line-height:1.7;border:1px solid transparent;white-space:nowrap}
.chip.p{background:var(--person-soft);color:var(--person)}
.chip.t{background:var(--theme-soft);color:var(--theme)}
.chip.m{background:var(--method-soft);color:var(--method)}
.chip.s{background:transparent;border-color:var(--line);color:var(--muted)}
.chip.k{background:var(--accent);color:var(--on-accent)}
button.chip{cursor:pointer;font:inherit;font-size:13px}
.pick{border:1px solid var(--line);background:var(--raise);border-radius:999px;padding:4px 14px;cursor:pointer;font-size:14px}
.pick[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pick.p[aria-pressed="true"]{background:var(--person);border-color:var(--person);color:var(--raise)}
.notice{border-radius:12px;padding:10px 14px;font-size:14px;background:var(--accent-soft);color:var(--ink)}
.notice.warn{background:var(--warn-soft)}
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + 24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;
  background:var(--ink);color:var(--bg);padding:8px 18px;border-radius:999px;font-size:14px;box-shadow:var(--shadow);max-width:90vw;text-align:center}
@media (min-width:761px){.toast{bottom:28px}}
.mood{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}

/* home */
.hello{padding-top:10px}
.hello .date{color:var(--muted);font-size:14px}
.hello h1{font-size:clamp(30px,6.5vw,44px);margin-top:2px}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:620px){.actions{grid-template-columns:1fr 1fr}}
.action.tool{box-shadow:none;background:var(--raise)}
@media (max-width:620px){.action{padding:12px 14px}.action b{font-size:18px}}
.action.tool i{color:var(--method)}
.action{text-align:left;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:18px;display:grid;gap:4px;box-shadow:var(--shadow);transition:transform .2s}
.action:hover{transform:translateY(-2px)}
.action b{font-family:var(--f-display);font-size:20px}
.action span{font-size:14px;color:var(--muted)}
.action i{font-style:normal;font-size:12px;letter-spacing:.12em;color:var(--accent)}
.action.session i{color:var(--person)}
.cols{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;align-items:start}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
.cols>*{min-width:0}
.steplist{display:grid;gap:8px}
.step{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.step .dot{width:10px;height:10px;border-radius:50%;background:var(--method)}
.step b{font-weight:500}
.step .sub{font-size:13px;color:var(--muted);display:block}
.qlist{display:grid;gap:6px}
.q{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.q input{margin-top:6px;accent-color:var(--accent)}
.q.done span{color:var(--muted);text-decoration:line-through}
.themebar{display:grid;gap:8px}
.tb{display:grid;grid-template-columns:1fr auto;gap:4px 10px;cursor:pointer;border:0;background:none;text-align:left;padding:0}
.tb .track{grid-column:1/-1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.tb .track i{display:block;height:100%;background:var(--theme);border-radius:3px}
.tb span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:620px){.how{grid-template-columns:1fr}}
.how div{display:grid;gap:4px}
.how b{font-family:var(--f-display);font-size:18px}
.how em{font-style:normal;color:var(--accent);font-family:var(--f-display);font-size:24px}

/* entries */
.elist{display:grid;gap:10px}
.erow{display:grid;grid-template-columns:auto 1fr;gap:14px;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;width:100%}
.erow:hover{border-color:var(--accent)}
.erow .when{display:grid;justify-items:center;align-content:start;gap:4px;min-width:44px;font-variant-numeric:tabular-nums}
.erow .when b{font-size:20px;font-family:var(--f-display);line-height:1}
.erow .when span{font-size:11px;color:var(--muted)}
.erow .body{display:grid;gap:4px;min-width:0}
.erow .title{font-weight:500}
.erow .ex{font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badge{font-size:11px;letter-spacing:.08em;padding:1px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.badge.session{background:var(--person-soft);color:var(--person)}
.badge.ex{background:transparent;border:1px dashed var(--muted);color:var(--muted)}
.search{width:100%;background:var(--raise);border:1px solid var(--line);border-radius:999px;padding:8px 16px}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:60;background:rgba(10,12,20,.45);display:flex;justify-content:center;align-items:flex-end}
@media (min-width:761px){.sheet-wrap{align-items:center}}
.sheet{background:var(--bg);width:min(100%,760px);max-height:94%;overflow:auto;border-radius:22px 22px 0 0;
  padding:0 max(18px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  box-shadow:0 -10px 40px rgba(0,0,0,.25)}
@media (min-width:761px){.sheet{border-radius:22px;max-height:90%}}
.sheet-top{position:sticky;top:0;z-index:2;background:var(--bg);padding:14px 0 10px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);margin-bottom:16px}
.sheet-top h2{font-size:20px;min-width:0}
.sheet-top>.row{flex-wrap:nowrap;flex:none}
.btn{white-space:nowrap}
.sheet-body{display:grid;gap:18px}
.field{display:grid;gap:6px}
.field>label,.field>.lab{font-weight:500;font-size:15px}
.field .hint{font-size:13px;color:var(--muted)}
.inp,textarea{width:100%;background:var(--raise);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;line-height:1.7}
textarea{min-height:110px;resize:vertical}
textarea.big{min-height:220px}
.inp:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ta-wrap{position:relative}
.mic{position:absolute;right:8px;bottom:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.mic.on{background:var(--warn);color:#fff;border-color:var(--warn)}
.partial{font-size:13px;color:var(--muted);min-height:1em}
.moods{display:flex;gap:8px;flex-wrap:wrap}
.moods button{border:1px solid var(--line);background:var(--raise);border-radius:12px;padding:6px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;font-size:14px}
.moods button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.seg{display:inline-flex;background:var(--accent-soft);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:999px;padding:5px 16px;cursor:pointer;color:var(--accent);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--ink);font-weight:500;box-shadow:var(--shadow)}
.addp{display:grid;grid-template-columns:1fr 1fr auto auto;gap:8px;align-items:center}
@media (max-width:560px){.addp{grid-template-columns:1fr 1fr}}
select.inp{padding:9px 10px}
.prose{white-space:pre-wrap;word-break:break-word}
.kv{display:grid;gap:12px}
.kv div{display:grid;gap:2px}
.kv b{font-size:13px;color:var(--muted);font-weight:500}
.quote{font-family:var(--f-display);font-size:19px;border-left:3px solid var(--person);padding-left:14px}

/* analysis */
.ana{display:grid;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.ana h3{font-size:18px}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.link{flex:1 1 140px;min-width:0;background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:grid;gap:2px;position:relative}
.link b{font-size:12px;letter-spacing:.1em;color:var(--accent);font-weight:500}
.link span{font-size:14px}
.need{font-family:var(--f-display);font-size:18px}
.sug{display:grid;gap:8px}
.sug .s{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.sug .s b{color:var(--method);font-weight:500}
@media (max-width:560px){.sug .s{grid-template-columns:1fr}}
.risk{background:var(--warn-soft);border-radius:12px;padding:14px 16px;display:grid;gap:6px}
.risk b{color:var(--warn)}
.applyl{display:grid;gap:6px}
.applyl label{display:flex;gap:8px;align-items:center;font-size:14px}
.applyl input{accent-color:var(--accent)}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.thinking i{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}

/* people */
.stagegrid{display:grid;gap:18px}
.stage h3{font-size:18px;display:flex;align-items:baseline;gap:10px}
.stage h3 span{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:400}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:10px}
.pcard{text-align:left;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;display:grid;gap:4px;min-width:0}
.pcard:hover{border-color:var(--person)}
.pcard .nm{display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:50%;background:var(--person-soft);color:var(--person);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;flex:none}
.pcard b{font-size:16px}
.pcard .rel{font-size:13px;color:var(--muted)}
.pcard .meta{font-size:12px;color:var(--muted)}

/* map */
.mapwrap{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;height:min(68vh,620px);min-height:380px;touch-action:none}
.mapwrap svg{width:100%;height:100%;display:block;cursor:grab}
#nodePanel{position:absolute;left:10px;right:10px;bottom:10px;max-height:58%;overflow:auto;touch-action:auto;pointer-events:none}
#nodePanel>*{pointer-events:auto}
#nodePanel .panel{box-shadow:var(--shadow);background:var(--raise)}
.maphint{display:inline-block;background:var(--raise);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:13px;color:var(--muted)}
.linked{display:grid;gap:8px;background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.chip .x{border:0;background:none;color:inherit;cursor:pointer;font-size:15px;line-height:1;padding:0 0 0 2px;opacity:.7}
.chip .x:hover{opacity:1}
.mapwrap svg.dragging{cursor:grabbing}
.nlabel{font-size:12px;fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.nlabel.big{font-size:14px;font-weight:700}
.mapctl{position:absolute;right:10px;top:10px;display:grid;gap:6px}
.mapctl button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--raise);cursor:pointer;font-size:18px;line-height:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.mini-e{display:block;width:100%;text-align:left;border:0;background:var(--raise);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:14px}
.mini-e span{color:var(--muted);font-size:12px;margin-right:8px;font-variant-numeric:tabular-nums}

/* journey */
.lanes{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:760px){.lanes{grid-template-columns:1fr 1fr}}

function toast(msg){const r=$("#toastRoot");r.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>r.innerHTML="",2600)}

/* ============================================================
   method library — rituals and psychology, each with its basis
   ============================================================ */
const CATS=[["ritual","儀式感"],["aware","覺察想法"],["emotion","情緒調節"],["body","照顧身體"],["mind","正念"],["action","行動與價值"],["relate","人際與界線"],["kind","溫柔對待自己"],["meaning","正向與意義"],["past","處理過去"],["weekly","每週新增"]];
const EVID={strong:["多項統合分析支持","var(--ok)"],mid:["有實驗或臨床研究支持","var(--method)"],theory:["來自治療取向的臨床做法","var(--muted)"]};

/* ---------- research library ---------- */
const RESEARCH=[
 {id:"R01",area:"儀式",ev:"mid",cite:"Norton & Gino（2014），Journal of Experimental Psychology: General",title:"儀式能減輕失落後的悲傷",
  finding:"在一系列實驗中，失去親人、結束關係，或在實驗中失去 200 美元獎金的人，做了儀式之後悲傷較低。實驗中的儀式很簡單：畫出感受、撒鹽、撕碎、數到十。效果來自重新找回控制感，而且不相信儀式的人一樣有效。",
  meaning:"面對無法改變的失去時，一個有開始、有結尾的小動作，可以讓心重新感覺「我還能做點什麼」。",limits:"多數是實驗室或線上研究，長期效果還不清楚。",url:"https://dash.harvard.edu/bitstream/1/10683152/1/norton%20gino_rituals-and-grief.pdf"},
 {id:"R02",area:"儀式",ev:"mid",cite:"Brooks 等人（2016），Organizational Behavior and Human Decision Processes",title:"上場前的儀式能降低焦慮",
  finding:"在公開唱歌、解數學題等高壓任務前，做一段簡短儀式的人，自評焦慮和心跳都較低，表現也較好。同樣的動作如果只被當成「隨機動作」，就沒有這個效果。",
  meaning:"面對讓你緊張的人或對話前，可以設計一組屬於自己的固定動作。",limits:"任務以短期表現為主，在人際情境中的效果還需要更多研究。",url:"https://ideas.repec.org/a/eee/jobhdp/v137y2016icp71-85.html"},
 {id:"R03",area:"儀式",ev:"mid",cite:"Vohs、Wang、Gino、Norton（2013），Psychological Science",title:"儀式讓人更投入當下",
  finding:"照固定步驟吃巧克力或紅蘿蔔的人，覺得食物更好吃、品嚐得更久。自己動手做的人才有效，旁觀別人做沒有效果。研究者認為儀式提高了「投入程度」。",
  meaning:"為日常安排一些自己動手的小儀式，可以讓人更專注、更能感受當下。",limits:"研究對象是食物體驗，延伸到情緒調節屬於推論。",url:"https://greatergood.berkeley.edu/article/item/do_rituals_help_us_to_savor_food"},
 {id:"R04",area:"書寫",ev:"strong",cite:"Pennebaker & Beall（1986），Journal of Abnormal Psychology；Frattaroli（2006），Psychological Bulletin",title:"把深刻的經驗寫下來，對身心有益",
  finding:"Pennebaker 讓受試者連續幾天、每天約 15–20 分鐘書寫創傷或深刻的經驗，之後幾個月的就醫次數減少。Frattaroli 整合了 146 個研究，發現表達性書寫有小而穩定的正面效果。",
  meaning:"日記本身就是有研究支持的練習，尤其是寫下事情「和你的感受」，而不只是流水帳。",limits:"效果量不大；剛寫完時情緒可能短暫變差，這是正常的。",url:"https://doi.org/10.1037/0021-843X.95.3.274"},
 {id:"R05",area:"情緒",ev:"mid",cite:"Lieberman 等人（2007），Psychological Science",title:"替情緒命名，能讓大腦的警報降下來",
  finding:"受試者看情緒強烈的臉孔時，如果替它選一個情緒詞，大腦杏仁核（警報系統）的活動會下降，前額葉的調節區域則較活躍。研究者稱為「情緒標記」。",
  meaning:"說出「我現在覺得委屈」而不只是「我很不爽」，本身就是一種調節。",limits:"實驗是在掃描儀中看圖片，和真實生活中的強烈情緒仍有差距。",url:"https://doi.org/10.1111/j.1467-9280.2007.01916.x"},
 {id:"R06",area:"情緒",ev:"mid",cite:"Kashdan、Barrett、McKnight（2015），Current Directions in Psychological Science",title:"情緒分得越細，越能調節情緒",
  finding:"能精細分辨自己情緒（例如分清楚失望、委屈、被忽略）的人，在壓力下比較不會用酗酒、攻擊等方式應對，情緒調節也較好。",
  meaning:"在心路裡練習用更精確的詞描述情緒，長期下來是在培養一種能力。",limits:"多為相關研究，因果方向仍在研究中。",url:"https://doi.org/10.1177/0963721414550708"},
 {id:"R07",area:"認知行為治療",ev:"strong",cite:"Hofmann 等人（2012），Cognitive Therapy and Research",title:"認知行為治療（CBT）的整體效果",
  finding:"這篇回顧整理了 269 篇統合分析，CBT 對焦慮相關問題、暴食、憤怒控制、一般壓力等有最強的證據，對憂鬱也有效。",
  meaning:"想法紀錄、找證據、去災難化等練習，都來自這個證據最多的心理治療取向。",limits:"不同問題的效果差異很大，自己練習的效果通常不如在治療師帶領下進行。",url:"https://doi.org/10.1007/s10608-012-9476-1"},
 {id:"R08",area:"認知行為治療",ev:"mid",cite:"Masuda 等人（2004），Behaviour Research and Therapy",title:"和想法拉開距離，能讓它變得沒那麼可信",
  finding:"讓受試者快速重複一個負面的自我評價詞（例如「笨」）幾十秒，這個詞帶來的不舒服和可信度都明顯下降。這是接受與承諾治療（ACT）中「認知脫鉤」的經典實驗。",

 {id:"R09",area:"接受與承諾治療",ev:"strong",cite:"A-Tjak 等人（2015），Psychotherapy and Psychosomatics",title:"接受與承諾治療（ACT）的效果",
  finding:"整合 39 個隨機對照試驗，ACT 在焦慮、憂鬱、物質使用、身體疼痛等問題上優於對照組，和其他成熟的治療效果相當。",
  meaning:"釐清價值、帶著不舒服仍往重要的方向前進，是有實證的做法。",limits:"部分研究品質參差，與 CBT 比較時沒有明顯優勢。",url:"https://doi.org/10.1159/000365764"},
 {id:"R10",area:"情緒調節",ev:"mid",cite:"Gross & John（2003），Journal of Personality and Social Psychology",title:"換個框架看，比把情緒壓下去更好",
  finding:"習慣用「重新評估」（換個角度理解事情）調節情緒的人，正向情緒較多、人際關係較好、幸福感較高；習慣「壓抑」的人則相反。",
  meaning:"處理情緒時，與其忍住，不如試著重新理解事情的意義。",limits:"相關研究，不能直接推論因果。",url:"https://doi.org/10.1037/0022-3514.85.2.348"},
 {id:"R11",area:"情緒調節",ev:"mid",cite:"Borkovec 等人（1983），Behaviour Research and Therapy",title:"把擔心集中到固定時間",
  finding:"受試者每天安排一段 30 分鐘的「擔心時間」，其他時候出現擔心就延後到那段時間處理。四週後，他們花在擔心上的時間明顯減少。",
  meaning:"擔心停不下來時，不是硬逼自己不想，而是先跟它約好時間。",limits:"早期研究，樣本為大學生。",url:"https://doi.org/10.1016/0005-7967(83)90121-3"},
 {id:"R12",area:"情緒調節",ev:"mid",cite:"Bowen & Marlatt（2009），Psychology of Addictive Behaviors",title:"衝動像浪，可以不跟著做",
  finding:"學習「衝動衝浪」（觀察渴望的起伏，不馬上行動）的吸菸者，一週後抽菸的數量較少，雖然渴望本身沒有減少。",
  meaning:"強烈的衝動（傳訊息給前任、想吵架）會來，也會退。不必消滅它，只要先不跟著做。",limits:"研究對象是吸菸，套用在情緒衝動屬於延伸。",url:"https://doi.org/10.1037/a0017221"},
 {id:"R13",area:"辯證行為治療",ev:"mid",cite:"Neacsiu、Rizvi、Linehan（2010），Behaviour Research and Therapy",title:"辯證行為治療（DBT）的技巧真的有用",
  finding:"接受 DBT 的個案，越常使用學到的技巧（情緒調節、人際效能、痛苦耐受），自殺行為、憂鬱和憤怒的改善就越多。",
  meaning:"相反行動、DEAR MAN 這類技巧，練得越多越有效。",limits:"研究對象為邊緣型人格的女性個案。",url:"https://doi.org/10.1016/j.brat.2010.05.017"},
 {id:"R14",area:"身體",ev:"strong",cite:"Noetel 等人（2024），BMJ",title:"運動對憂鬱有明確的效果",
  finding:"整合 218 個隨機對照試驗的網絡統合分析：走路或慢跑、瑜伽、肌力訓練對憂鬱都有中等程度的改善，強度越高效果越好。有結構、有人帶的運動計畫效果較好。",
  meaning:"心情低落時，規律地動起來是有力的方法，不一定要很激烈，走路也有效。",limits:"許多試驗規模小、無法盲測。",url:"https://doi.org/10.1136/bmj-2023-075847"},
 {id:"R15",area:"身體",ev:"mid",cite:"Bratman 等人（2015），PNAS",title:"在自然裡走路，比較不會反覆鑽牛角尖",
  finding:"在自然環境走 90 分鐘的人，「反芻思考」（反覆想負面的事）減少，大腦中與反芻有關的區域（膝下前額葉）活動下降；在都市街道走同樣時間的人則沒有變化。",
  meaning:"一直想同一件事、停不下來時，去公園或山邊走一走是有根據的。",limits:"樣本只有約 38 人，一次性的效果。",url:"https://doi.org/10.1073/pnas.1510459112"},
 {id:"R16",area:"身體",ev:"strong",cite:"Trauer 等人（2015），Annals of Internal Medicine",title:"失眠的認知行為治療（CBT-I）",
  finding:"整合 20 個研究、1,162 人：CBT-I 讓入睡時間平均縮短約 19 分鐘，半夜醒來的時間減少約 26 分鐘，睡眠效率提升約 10%。",
  meaning:"睡不好會讓情緒更難處理。固定起床時間、只在想睡時上床，是效果最好的做法之一。",limits:"完整的 CBT-I 通常需要專業人員帶領。",url:"https://pubmed.ncbi.nlm.nih.gov/26054060/"},
 {id:"R17",area:"身體",ev:"strong",cite:"Manzoni 等人（2008），BMC Psychiatry",title:"放鬆訓練能降低焦慮",
  finding:"整合 27 個研究，漸進式肌肉放鬆、呼吸放鬆等放鬆訓練，對焦慮有中到大的改善效果。",
  meaning:"身體放鬆了，心比較容易跟著放鬆。呼吸和肌肉放鬆都值得每天練一點。",limits:"研究之間差異大。",url:"https://doi.org/10.1186/1471-244X-8-41"},
 {id:"R18",area:"正念",ev:"strong",cite:"Kuyken 等人（2016），JAMA Psychiatry",title:"正念認知治療（MBCT）能預防憂鬱復發",
  finding:"整合 9 個試驗、1,258 位曾經憂鬱的人：接受 MBCT 的人，60 週內憂鬱復發的風險比只接受一般照護的人低約 31%。",
  meaning:"身體掃描、三分鐘呼吸空間都來自 MBCT。它特別適合曾經低落過、想避免再陷進去的人。",limits:"對象是曾有憂鬱症的人，不是一般人。",url:"https://pubmed.ncbi.nlm.nih.gov/27119968/"},
 {id:"R19",area:"自我關懷",ev:"strong",cite:"MacBeth & Gumley（2012），Clinical Psychology Review",title:"自我關懷越高，憂鬱、焦慮、壓力越低",
  finding:"整合 20 個研究，自我關懷和憂鬱、焦慮、壓力之間有很強的負相關（相關係數約 −0.54）。",
  meaning:"對自己溫柔不是放縱，而是和心理健康最密切相關的能力之一。",limits:"相關研究；不能說自我關懷「造成」較少的症狀。",url:"https://pubmed.ncbi.nlm.nih.gov/22796446/"},
 {id:"R20",area:"自我關懷",ev:"mid",cite:"Hofmann、Grossman、Hinton（2011），Clinical Psychology Review",title:"慈心與悲憫靜心能增加正向情緒",
  finding:"回顧研究發現，練習慈心（祝福自己和他人）與悲憫靜心，能增加正向情緒、減少負向情緒，也和人際連結感提升有關。",
  meaning:"對關係感到受傷時，慈心練習能從內在慢慢修復對人的感覺。",limits:"研究數量和品質仍在累積中。",url:"https://doi.org/10.1016/j.cpr.2011.07.003"},
 {id:"R21",area:"行動",ev:"mid",cite:"Dimidjian 等人（2006），Journal of Consulting and Clinical Psychology",title:"行為活化對憂鬱的效果",
  finding:"在中重度憂鬱的個案中，行為活化（有計畫地重新安排有意義、有成就感的活動）的效果和抗憂鬱藥相當，也優於認知治療。",
  meaning:"低落時不必等到有動力才行動，先做一件小事，動力會慢慢跟上來。",limits:"單一大型試驗，後續研究結果大致一致。",url:"https://doi.org/10.1037/0022-006X.74.4.658"},
 {id:"R22",area:"行動",ev:"strong",cite:"Gollwitzer & Sheeran（2006），Advances in Experimental Social Psychology",title:"「如果…就…」計畫能讓人真的做到",
  finding:"整合 94 個研究：把目標寫成「如果遇到情境 X，我就做 Y」的人，達成目標的程度明顯較高（中到大的效果）。",
  meaning:"選好下一步之後，把它寫成「如果媽媽又問我什麼時候回家，我就說……」，比較容易做到。",limits:"對很困難、需要長期堅持的目標，效果較小。",url:"https://doi.org/10.1016/S0065-2601(06)38002-1"},
 {id:"R23",area:"人際",ev:"strong",cite:"Holt-Lunstad、Smith、Layton（2010），PLoS Medicine",title:"人際關係和壽命一樣重要",
  finding:"整合 148 個研究、30 多萬人：社會關係較強的人，存活的可能性高出約 50%，影響程度和戒菸相當。",
  meaning:"你在心路裡處理的人際課題，不只關係到心情，也關係到整體健康。",limits:"觀察性研究。",url:"https://doi.org/10.1371/journal.pmed.1000316"},
 {id:"R24",area:"人際",ev:"mid",cite:"Hazan & Shaver（1987），Journal of Personality and Social Psychology",title:"成年後的親密關係，延續了小時候的依附模式",
  finding:"成人的戀愛關係可以分成安全、焦慮、逃避等依附風格，比例和嬰兒依附研究相似，而且和他們描述的童年親子關係有關。",
  meaning:"在感情中特別怕被丟下，或特別想保持距離，可能和早年的依附經驗有關。這是很值得和諮商師討論的方向。",limits:"依附風格會隨經驗改變，不是一輩子固定。",url:"https://doi.org/10.1037/0022-3514.52.3.511"},
 {id:"R25",area:"人際",ev:"mid",cite:"Gottman & Levenson（1992），Journal of Personality and Social Psychology",title:"關係裡最傷的四種溝通方式",
  finding:"Gottman 長期觀察伴侶的互動，發現批評、輕蔑、防衛、冷戰這四種模式，能預測關係的惡化。能在衝突中「修復」的伴侶，關係較穩定。",
  meaning:"人際衝突中，重點不是不吵架，而是避開這四種模式，並學會修復。",limits:"研究對象主要是伴侶，延伸到家人、職場是推論。",url:"https://doi.org/10.1037/0022-3514.63.2.221"},
 {id:"R26",area:"童年經驗",ev:"strong",cite:"Felitti 等人（1998），American Journal of Preventive Medicine",title:"童年的困難經驗會影響一生",
  finding:"超過九千位成人的研究：童年經歷越多種困難（例如被虐待、家人衝突、家人有成癮問題），成年後的身心健康風險越高，呈現劑量效應。",
  meaning:"如果你發現現在的課題和童年有關，那不是你想太多，而是有大量研究支持的現象。它也說明了為什麼值得好好處理。",limits:"童年經驗是回溯自述；風險不代表命運，保護因子和後來的支持同樣重要。",url:"https://doi.org/10.1016/S0749-3797(98)00017-8"},
 {id:"R27",area:"童年經驗",ev:"theory",cite:"Young、Klosko、Weishaar（2003），《基模治療》",title:"童年形成的「基模」會在長大後被觸發",
  finding:"基模治療認為，童年核心需求（安全、被接納、自主）沒被滿足時，會形成「我不夠好」「別人會離開我」這類深層信念，並在長大後的關係中一再被觸發。",
  meaning:"這是心路「把不同時期的人連起來」的理論基礎。看見重複的模式，是改變的起點。",limits:"理論框架；對特定問題（如邊緣型人格）已有臨床試驗支持。",url:"https://www.guilford.com/books/Schema-Therapy/Young-Klosko-Weishaar/9781593853723"},
 {id:"R28",area:"創傷",ev:"strong",cite:"Cusack 等人（2016），Clinical Psychology Review",title:"處理創傷，有證據支持的治療",
  finding:"整合 64 個試驗：延長暴露、認知處理治療、認知治療、EMDR 等以創傷為焦點的治療，對創傷後壓力症狀都有明確效果。",
  meaning:"如果過去有很深的傷，請和諮商師討論這些方法，不建議自己一個人重新回到創傷記憶裡。",limits:"這些治療都需要受過訓練的專業人員帶領。",url:"https://doi.org/10.1016/j.cpr.2015.10.003"},
 {id:"R29",area:"正向",ev:"mid",cite:"Seligman、Steen、Park、Peterson（2005），American Psychologist",title:"三件好事與感恩拜訪",
  finding:"隨機對照實驗中，連續一週每晚寫下「三件好事和它們發生的原因」，以及「用新的方式運用自己的優勢」，在之後六個月持續提升幸福感、降低憂鬱症狀。「感恩拜訪」的效果很強，但大約一個月後就消退。",
  meaning:"正向練習不是否認痛苦，而是讓注意力也看得見其他東西。",limits:"網路樣本，參與者是自願者。",url:"https://doi.org/10.1037/0003-066X.60.5.410"},
 {id:"R30",area:"正向",ev:"mid",cite:"King（2001），Personality and Social Psychology Bulletin",title:"寫下最好的未來自己",
  finding:"連續四天、每天 20 分鐘寫下「一切順利時的未來自己」，比書寫創傷更能提升主觀幸福感，而且不會帶來情緒的短暫下降；幾個月後的就醫次數也較少。",
  meaning:"除了回頭看傷，也可以往前看，想像自己想成為的樣子。",limits:"樣本是大學生。",url:"https://doi.org/10.1177/0146167201277003"},
 {id:"R31",area:"諮商",ev:"strong",cite:"Flückiger 等人（2018），Psychotherapy",title:"和諮商師的關係，是療效的重要關鍵",
  finding:"整合 295 個研究、超過三萬位個案：個案與治療師的「工作同盟」（信任、對目標和做法的共識）和治療效果穩定相關（r ≈ 0.28），不論哪種治療取向都一樣。",
  meaning:"把心路裡的紀錄和問題帶去諮商，讓諮商師更了解你，本身就在強化這段同盟。覺得不對勁時，也可以直接跟諮商師說。",limits:"相關研究。",url:"https://www.societyforpsychotherapy.org/the-alliance-in-adult-psychotherapy/"}
];
/* weekly updates — written to the shared "weekly" collection by a scheduled research task; treated as untrusted text */
let WEEK=new Map();
const safeUrl=u=>/^https:\/\/[^\s"'<>]+$/.test(String(u||""))?String(u):"";
const EVK=k=>["strong","mid","theory"].includes(k)?k:"mid";
function weeklyIssues(){return [...WEEK.values()].filter(w=>w&&Array.isArray(w.items)).sort((a,b)=>String(b.issue||"").localeCompare(String(a.issue||"")))}
function weeklyItems(){const out=[];weeklyIssues().forEach(w=>w.items.forEach((it,i)=>{if(it&&it.title)out.push({it,w,id:"WK-"+String(w.issue||w.id)+"-"+i})}));return out}
function weeklyResearch(){return weeklyItems().map(({it,w,id})=>({id,area:"每週新知",ev:EVK(it.ev),cite:esc(it.cite||""),title:esc(it.title),finding:esc(it.finding||""),meaning:esc(it.meaning||"")+(it.tryIt?`<br><br><b>生活中可以這樣用</b><br>${esc(it.tryIt)}`:""),limits:esc(it.limits||"尚未說明"),url:safeUrl(it.url),issue:String(w.issue||""),published:esc(it.published||""),weekly:true}))}
const allResearch=()=>[...weeklyResearch(),...RESEARCH];
const researchById=id=>allResearch().find(r=>r.id===id);

/* ---------- method library ---------- */
const METHODS=[
 /* ritual */
 {id:"r_tear",cat:"ritual",ev:"mid",refs:["R01"],name:"寫下、撕掉、數到十",when:"失落、被拒絕、事情已經無法挽回時",
  what:"把此刻的感受畫下來或寫下來，然後用一個固定的動作結束它。",
  steps:["拿一張紙，用幾個字或簡單的線條，寫下或畫出現在的感受","慢慢看一遍，承認它：這就是我現在的感覺","把紙對折、撕成小片","深呼吸，從一數到十","把碎紙丟掉，對自己說：我允許這件事結束"]},
 {id:"r_letter",cat:"ritual",ev:"strong",refs:["R01","R04"],name:"一封不寄出的信",when:"有話想對某人說，但說不出口、不能說，或對方已經不在",
  what:"寫一封完整的信給那個人，寫完不寄出，用你選的方式收起來或銷毀。",
  steps:["找一段不被打擾的 20 分鐘","寫下對方的稱呼作為開頭","寫你一直沒說的話：發生了什麼、你當時的感受、你希望的是什麼","最後一段寫：我現在想對自己說的話","讀一遍，決定它的去處：撕掉、燒掉，或封起來放進抽屜"]},
 {id:"r_close",cat:"ritual",ev:"mid",refs:["R01"],name:"告別儀式",when:"一段關係、一個階段結束了，心裡卻還沒結束",
  what:"為結束安排一個有開始、有結尾的小儀式，讓心知道「這裡可以畫句點了」。",
  steps:["選一個代表這段關係或階段的物品、照片或地點","寫下三件這段經歷給你的東西（好的、難的都可以）","在一個你選的日子跟它說再見：收進盒子、歸還，或最後一次回到那個地方","離開時做一個象徵開始的動作，例如換一條新的回家路"]},
 {id:"r_pre",cat:"ritual",ev:"mid",refs:["R02"],name:"上場前的小儀式",when:"要面對一場困難的對話、見某個讓你緊張的人之前",
  what:"在進場前做一組固定的小動作，讓身體和心先準備好。",
  steps:["設計三個步驟，例如：雙手握拳三秒再放開、長長吐一口氣、在心裡說一句「我可以慢慢說」","每次面對那個人之前，都照同一個順序做","結束後記一筆：這次跟以前有什麼不同"]},
 {id:"r_daily",cat:"ritual",ev:"mid",refs:["R03"],name:"一天的開場與收尾",when:"日子很亂、心很散，需要一點穩定的節奏",
  what:"為早上或睡前設計一個固定的小儀式，例如用同一套步驟泡一杯茶。",
  steps:["選一個每天都做得到的時刻","設計 3 到 4 個固定步驟（燒水、聞茶葉、看著茶色變深、雙手捧著喝第一口）","每次都照同樣的順序，慢慢做","收尾時問自己一句：今天我需要什麼？"]},
 /* aware */
 {id:"a_name",cat:"aware",ev:"mid",refs:["R05","R06"],name:"為情緒命名",when:"情緒很滿、很亂，說不清楚自己怎麼了",
  what:"用盡量精確的詞說出現在的情緒：不只是「不好」，而是「委屈」「被忽略」「失望」。",
  steps:["停下來，問自己：我現在的感覺是什麼？","先說大類：生氣、難過、害怕、羞愧……","再往下找更精確的詞：是「失望」還是「被背叛」？","說出來或寫下來：我現在感到______，因為______"]},
 {id:"c_abc",cat:"aware",ev:"strong",refs:["R07"],name:"想法紀錄：事件、想法、情緒",when:"同樣的情緒反覆出現，想看清楚是什麼觸發了它",
  what:"把一件事拆成：發生了什麼、我怎麼解讀、因此產生什麼情緒和行動。心路的「幫我整理」就是用這個架構。",
  steps:["寫下事件：只寫事實，像攝影機拍到的","寫下當下的自動想法：腦中閃過的那一句","寫下情緒和強度（0 到 100）","問自己：還有沒有別的解讀？","重新評一次情緒的強度"]},
 {id:"c_evidence",cat:"aware",ev:"strong",refs:["R07"],name:"替想法找證據",when:"一個念頭讓你很痛，例如「我很沒用」「沒有人在乎我」",
  what:"把念頭當成假設，而不是事實，分別列出支持和反對它的證據。",
  steps:["寫下那個念頭","列出支持它的事實（只寫事實，不寫感覺）","列出不支持它的事實，包括別人說過、你做到過的事","寫一句比較平衡的說法","留意寫完之後，心裡有什麼不同"]},
 {id:"c_decat",cat:"aware",ev:"strong",refs:["R07"],name:"最壞、最好、最可能",when:"腦中一直往最壞的方向想，覺得「完蛋了」",
  what:"把災難化的想像攤開，分別寫出最壞、最好和最可能的結果。",
  steps:["寫下你擔心會發生的最壞結果","寫下最好的結果，即使覺得不可能","寫下最可能發生的結果","問自己：如果最壞的真的發生，我可以怎麼應對？誰能幫我？","看看現在的擔心，跟「最可能」差多遠"]},
 {id:"c_defuse",cat:"aware",ev:"mid",refs:["R08","R09"],name:"和想法拉開一點距離",when:"一個念頭黏著你，怎麼爭辯都沒用",
  what:"不和念頭爭辯，而是換一種方式看它：它只是腦中出現的一句話。",
  steps:["把念頭寫成一句短句，例如「我很失敗」","在前面加上：「我注意到，我有一個想法是……」","大聲、快速重複那句話裡的關鍵詞 30 秒，直到它變成一串聲音","問自己：這個想法現在對我有幫助嗎？","不論有沒有，都讓它待著，然後回到你正在做的事"]},
 {id:"c_pattern",cat:"aware",ev:"theory",refs:["R27","R24"],name:"把重複的模式擺在一起",when:"你發現自己對不同的人，好像都有類似的反應",
  what:"把同一個課題下的三件事並排，找出共同的觸發點、想法和反應。",
  steps:["在「地圖」裡點一個課題，看看連到哪些人和紀錄","挑三件事，分別寫下：當時是誰、發生什麼、我想到什麼、我做了什麼","圈出三件事裡重複出現的詞","問自己：這個反應最早是什麼時候學會的？","把發現帶去下次諮商"]},
 /* emotion */
 {id:"e_reappraise",cat:"emotion",ev:"mid",refs:["R10"],name:"換個框架看",when:"一件事讓你很受傷，卻只看得到一種解釋",
  what:"不壓抑情緒，而是試著用另一個角度理解同一件事。",
  steps:["寫下事件，以及你目前的解讀","想想：一年後的我，會怎麼看這件事？","想想：對方可能正在經歷什麼？","想想：這件事讓我學到或看見了什麼？","選一個最能接受的角度，寫成一句話"]},
 {id:"e_opposite",cat:"emotion",ev:"mid",refs:["R13"],name:"相反行動",when:"情緒推著你做一件你知道會讓事情更糟的事",
  what:"辨識情緒想讓你做的事，然後刻意做相反的事。這是辯證行為治療（DBT）的技巧。",
  steps:["說出情緒：我現在是______","說出它想讓我做的事：例如難過想躲起來、生氣想反擊","問自己：照著做，會讓事情變好嗎？","如果不會，選相反的行動：難過時出門走走、生氣時先溫和地離開","全心做那個相反行動，然後留意情緒的變化"]},
 {id:"e_surf",cat:"emotion",ev:"mid",refs:["R12"],name:"情緒衝浪",when:"有一股很強的衝動：想傳訊息、想吵架、想逃",
  what:"把衝動看成一道浪，觀察它升起、到頂、退下，不跟著它行動。",
  steps:["察覺衝動，告訴自己：浪來了","注意它在身體的哪裡，是什麼感覺","像衝浪一樣跟著呼吸，觀察它的強度變化","通常幾分鐘內，浪會到頂、開始退","浪退了之後，再決定要不要行動"]},
 {id:"e_worry",cat:"emotion",ev:"mid",refs:["R11"],name:"擔心時間",when:"擔心一直冒出來，影響工作和睡眠",
  what:"每天安排固定 20 到 30 分鐘專門擔心，其他時間出現的擔心就先記下、延後處理。",
  steps:["選一個固定時段和地點（不要在床上、不要睡前）","白天擔心出現時，寫下一個關鍵字，告訴自己：等一下再想","到了擔心時間，把清單上的事一件件想完","想完能做的就排進行動，不能做的就放下","時間到就停，下次再繼續"]},
 /* body */
 {id:"b_breath",cat:"body",ev:"strong",refs:["R17"],name:"延長吐氣呼吸",when:"緊張、生氣、心跳很快的時候",
  what:"吸氣 4 秒、停 4 秒、吐氣 6 秒，做 5 輪。吐氣比吸氣長，能幫身體從緊繃模式退下來。",
  steps:["坐好或躺好，一手放在腹部","用鼻子吸氣 4 秒，感覺腹部鼓起","停住 4 秒","用嘴巴慢慢吐氣 6 秒","重複 5 輪，留意身體的變化"]},
 {id:"b_pmr",cat:"body",ev:"strong",refs:["R17"],name:"漸進式肌肉放鬆",when:"身體很緊、肩頸僵硬、睡不著",
  what:"一個部位一個部位地先用力、再放鬆，讓身體記得放鬆的感覺。",
  steps:["從雙手開始：握緊拳頭 5 秒，再完全放開 10 秒","依序做手臂、肩膀、臉、肚子、大腿、小腿、腳","每次放鬆時，留意緊和鬆的差別","最後讓整個身體一起鬆開，停留一分鐘"]},
 {id:"b_ground",cat:"body",ev:"theory",refs:[],name:"5-4-3-2-1 著陸",when:"焦慮、恐慌，或被回憶拉走、覺得不在現場時",
  what:"用五種感官，把注意力帶回此時此地。這是處理焦慮和創傷反應時常用的著陸技巧。",
  steps:["說出 5 樣你看得到的東西","感覺 4 樣你摸得到的東西","聽 3 種聲音","找 2 種氣味","感覺嘴裡的 1 種味道"]},
 {id:"b_move",cat:"body",ev:"strong",refs:["R14"],name:"動起來",when:"心情低落、提不起勁，或壓力很大的一段時間",
  what:"安排規律的身體活動。走路、慢跑、瑜伽、肌力訓練都有研究支持。",
  steps:["選一種你不討厭的運動，從每次 20 分鐘開始","排進固定的日子，例如一週三次","可以的話找人一起，或參加有人帶的課程","做完記一下運動前後的心情","慢慢增加強度，強度高一點效果通常更好"]},
 {id:"b_nature",cat:"body",ev:"mid",refs:["R15"],name:"走進自然",when:"一直反覆想同一件事、停不下來",
  what:"去有樹、有水、有山的地方走一段時間，不帶任務，只是走。",
  steps:["找一個附近的公園、河濱或步道","把手機調成勿擾","慢慢走，留意看到的綠色、聽到的聲音","念頭出現時不用趕走，讓它跟著你走","回來後寫一句：走完之後，那件事看起來有什麼不同"]},
 {id:"b_sleep",cat:"body",ev:"strong",refs:["R16"],name:"把睡眠找回來",when:"睡不著、睡不好，白天情緒更難控制",
  what:"失眠認知行為治療（CBT-I）的核心做法：讓床只和睡覺連在一起。",
  steps:["每天固定時間起床，週末也一樣","想睡了才上床","躺了大約 20 分鐘還睡不著，就起來做一件安靜的事，想睡再回去","床只用來睡覺，不在床上滑手機或工作","白天不補長時間的午覺"]},
 /* mind */
 {id:"m_space",cat:"mind",ev:"strong",refs:["R18"],name:"三分鐘呼吸空間",when:"忙亂的一天裡，想給自己一個停頓",
  what:"正念認知治療（MBCT）的核心練習：覺察、聚焦、擴展，各一分鐘。",
  steps:["第一分鐘，覺察：此刻有什麼想法、情緒、身體感覺？只是看見","第二分鐘，聚焦：把注意力收到呼吸上，感覺一吸一吐","第三分鐘，擴展：讓覺察擴展到整個身體、坐姿、表情","帶著這份覺察，回到你的一天"]},
 {id:"m_scan",cat:"mind",ev:"strong",refs:["R18"],name:"身體掃描",when:"身體很累、心很散，或睡前想放鬆",
  what:"從腳底到頭頂，一處一處把注意力帶過身體，不改變什麼，只是感覺。",
  steps:["躺下或坐好，閉上眼睛","從腳趾開始，感覺那裡的溫度、壓力、刺麻","慢慢往上：小腿、膝蓋、大腿、腹部、胸口、肩膀、手臂、脖子、臉","注意力飄走時，溫和地帶回來","最後感覺整個身體，停留一會兒"]},
 /* action */
 {id:"ac_activity",cat:"action",ev:"strong",refs:["R21"],name:"小小的活動排程",when:"低落、什麼都不想做，日子好像停住了",
  what:"行為活化：不等動力出現，先安排幾件有意義或有成就感的小事。",
  steps:["列出三種活動：讓你開心的、讓你有成就感的、對你重要的","從每類挑一件很小的（例如洗一個碗、傳一則訊息給朋友）","排進明天的具體時間","做完後替心情和成就感各打一個分數（0 到 10）","下週根據分數，多安排讓你好一點的活動"]},
 {id:"ac_values",cat:"action",ev:"strong",refs:["R09"],name:"價值羅盤",when:"不知道自己想要什麼，或總是照別人的期待活",
  what:"接受與承諾治療（ACT）的練習：釐清在關係、工作、自己、休閒中，你在乎的是什麼樣的人。",
  steps:["在四個領域各寫一句：我想成為一個______的人（例如：在關係中，誠實而溫暖）","替每個領域打分數：最近活得有多接近它？（0 到 10）","挑分數最低的一個，想一個這週能做的小行動","做的時候，不舒服的感覺可能還在，這是正常的","週末回來看：做了之後，有沒有更像自己一點？"]},
 {id:"ac_ifthen",cat:"action",ev:"strong",refs:["R22"],name:"「如果……就……」計畫",when:"知道該做什麼，但到了那個時刻總是做不到",
  what:"把下一步寫成具體的情境和行動，讓大腦在那個時刻自動想起來。",
  steps:["寫下你想做到的事","找出會遇到的關鍵情境：什麼時候、跟誰、在哪裡","寫成：「如果______，我就______。」","例如：「如果媽媽問我什麼時候回家，我就先說謝謝她想我，再說我這週很累。」","把這句話放在看得到的地方，事後回來記錄有沒有做到"]},
 /* relate */
 {id:"p_ineed",cat:"relate",ev:"theory",refs:[],name:"用「我」開頭說出需要",when:"想告訴某人你的感受，又怕一開口就吵架",
  what:"Marshall Rosenberg 的「非暴力溝通」：用觀察、感受、需要、請求四個部分來說話。",
  steps:["觀察：只說具體發生的事（「這週你打了三次電話問我什麼時候回家」）","感受：說你的感受（「我覺得有壓力」）","需要：說背後的需要（「因為我最近工作很累，需要休息」）","請求：提出具體、做得到的請求（「我們可以約週日晚上一起吃飯嗎？」）","先寫下來練習，再找時機說"]},
 {id:"p_dearman",cat:"relate",ev:"mid",refs:["R13"],name:"DEAR MAN 提出請求",when:"需要向主管、家人提出一個要求，或拒絕一件事",
  what:"辯證行為治療（DBT）的人際效能技巧，讓請求清楚又不傷關係。",
  steps:["描述（Describe）：說出事實","表達（Express）：說出你的感受和想法","主張（Assert）：清楚說出你要什麼，或你不要什麼","增強（Reinforce）：說明這對對方的好處","保持專注、表現自信、願意協商：被岔開時溫和地回到你的請求"]},
 {id:"p_boundary",cat:"relate",ev:"theory",refs:[],name:"練習一個小界線",when:"常常答應不想答應的事，事後很累或很委屈",
  what:"從一個風險很小的情境開始，練習說「不」或「我需要想一下」。",
  steps:["挑一個低風險的情境（例如晚上十點後不回工作訊息）","準備一句話：「這個我需要想一下，明天回你」","實際說一次","記下對方的反應，以及你自己的感受","留意：最壞的情況真的發生了嗎？"]},
 {id:"p_repair",cat:"relate",ev:"mid",refs:["R25"],name:"避開四種傷人的溝通，學會修復",when:"和伴侶、家人總是越吵越兇",
  what:"Gottman 發現批評、輕蔑、防衛、冷戰最傷關係。練習用替代的說法，並在衝突中主動修復。",
  steps:["回想最近一次衝突，看看出現了哪幾種：批評、輕蔑、防衛、冷戰","把批評換成「我」開頭的抱怨（不攻擊人格）","把防衛換成承擔一小部分：「這部分我確實有做不好」","快要冷戰時，說：「我需要 20 分鐘冷靜，等一下回來談」","衝突後找一個修復的動作：一句道歉、一個擁抱、一杯茶"]},
 {id:"p_attach",cat:"relate",ev:"mid",refs:["R24"],name:"看見自己的依附模式",when:"在親密關係中特別怕被丟下，或特別想保持距離",
  what:"回顧你在不同關係中的反應，看看是偏向焦慮（怕失去）還是逃避（怕靠近）。",
  steps:["回想你最親近的三段關係（家人、伴侶、好友）","寫下：當對方沒回訊息、需要空間時，我通常怎麼反應？","寫下：當對方很靠近、需要我時，我通常怎麼反應？","看看有沒有共同的模式，它像不像小時候和照顧者的相處？","把發現帶去諮商，和諮商師一起理解它"]},
 {id:"p_reach",cat:"relate",ev:"strong",refs:["R23"],name:"主動連結一個人",when:"覺得孤單，或習慣一個人扛所有事",
  what:"每週主動和一個人有真實的接觸，不一定要談心事。",
  steps:["列出三個你覺得相處起來安全的人","這週挑一個，傳訊息約喝咖啡、散步或通個電話","見面時試著分享一件真實的小事","結束後記下：跟他相處時，我的感覺是什麼？","下週換一個人，或再約同一個人"]},
 {id:"p_chair",cat:"relate",ev:"theory",refs:["R27"],withCounselor:true,name:"空椅對話",when:"對某個人有很多沒說完的話，特別是過去的人",
  what:"想像那個人坐在對面的椅子上，把想說的話說出來，再換位置用對方的角度回應。源自完形治療。",
  steps:["跟諮商師提出想做這個練習","在諮商室裡，由諮商師引導進行","結束後記下：說出了什麼、身體有什麼感覺","回來寫一篇日記，把它連到那個人"]},
 /* kind */
 {id:"k_three",cat:"kind",ev:"strong",refs:["R19"],name:"自我關懷三步驟",when:"自責、覺得自己很糟的時候",
  what:"Kristin Neff 的自我關懷：承認痛苦、提醒自己不孤單、對自己說一句溫柔的話。",
  steps:["把手放在胸口，對自己說：這是很難受的時刻","提醒自己：難受是人生的一部分，很多人也正經歷著","問自己：如果是好朋友遇到這件事，我會對他說什麼？","把那句話對自己說一遍"]},
 {id:"k_letter",cat:"kind",ev:"strong",refs:["R19"],name:"從朋友的角度寫一封信給自己",when:"一直放不下某個缺點或錯誤",
  what:"想像一位完全接納你的朋友，用他的口吻寫一封信給你。",
  steps:["寫下讓你覺得羞愧或不夠好的那件事","想像一位無條件接納你、了解你所有經歷的朋友","用他的口吻寫信給你：他怎麼看這件事？他會怎麼安慰你？","放一陣子再讀，讓那些話慢慢進到心裡"]},
 {id:"k_inner",cat:"kind",ev:"theory",refs:["R27"],name:"寫給小時候的自己",when:"發現現在的痛，跟小時候的經驗有關",
  what:"以現在的你，寫幾句話給當年那個孩子。基模治療中的「重新養育」也有類似的做法。如果情緒太強，可以停下來，帶去諮商時一起處理。",
  steps:["找一張那個年紀的照片，或想像當時的自己","寫下：那時候發生了什麼","寫下：那時候的你最需要聽到什麼","把那句話寫給他，用你最溫柔的語氣","寫完，告訴自己：現在我會照顧你"]},
 {id:"k_metta",cat:"kind",ev:"mid",refs:["R20"],name:"慈心祝福",when:"對某個人有很多怨，或對人失去信任",
  what:"在心裡依序祝福自己、所愛的人、普通的人，最後是讓你受傷的人（還沒準備好可以跳過）。",
  steps:["把手放在胸口，對自己說：願我平安、健康、快樂","想一個你愛的人，對他說同樣的話","想一個不太熟的人，對他說同樣的話","如果準備好了，想一個讓你有點受傷的人，試著說一次","最後回到自己，停留一會兒"]},
 /* meaning */
 {id:"g_three",cat:"meaning",ev:"mid",refs:["R29"],name:"三件好事",when:"最近只看得到不好的事",
  what:"連續一週，每晚寫下三件好事，以及它們為什麼會發生。",
  steps:["睡前寫下今天三件好事，大小都可以","每件後面寫：為什麼會發生？（例如：因為我主動問了同事）","連續做七天","第七天讀一遍，看看哪些好事跟你自己有關"]},
 {id:"g_visit",cat:"meaning",ev:"mid",refs:["R29"],name:"感恩拜訪",when:"想起某個曾經幫過你、卻沒好好道謝的人",
  what:"寫一封具體的感謝信給他，最好當面念給他聽。",
  steps:["想一個曾經真正幫助過你的人","寫下：他做了什麼、那對你有什麼影響、你現在怎麼樣了","約他見面，或打電話念給他聽","記下對方的反應，和你自己的感受"]},

/* ============================================================
   privacy — pseudonymize names, mask identifiers before anything leaves the device
   ============================================================ */
const CODE=i=>{let s="";i++;while(i>0){i--;s=String.fromCharCode(65+i%26)+s;i=Math.floor(i/26)}return s};
function protect(text){
  const st=settings(),map=[];
  const names=[...new Set([...people().map(p=>p.name),...String(st.maskWords||"").split(/[\n,，、]/)].map(x=>String(x||"").trim()).filter(x=>x.length>=2))].sort((a,b)=>b.length-a.length);
  let t=String(text);
  names.forEach((n,i)=>{if(!t.includes(n))return;const code=`［人物${CODE(i)}］`;map.push([code,n]);t=t.split(n).join(code)});
  const masks=[[/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g,"［Email］"],[/\b[A-Z][12489]\d{8}\b/g,"［身分證號］"],[/(?:\+?886[-\s]?|0)9\d{2}[-\s]?\d{3}[-\s]?\d{3}/g,"［手機］"],[/\(?0\d{1,2}\)?[-\s]?\d{3,4}[-\s]?\d{4}/g,"［電話］"],[/\b(?:\d[ -]?){13,19}\b/g,"［卡號］"]];
  let masked=0;masks.forEach(([re,rep])=>{t=t.replace(re,()=>{masked++;return rep})});
  const head=map.length?"（說明：文中的［人物A］這類代號代表真實人物，為了保護隱私已替換。請直接沿用代號，不要猜測真名。）\n\n":"";
  return{text:head+t,map,masked}}
function restore(text,map){let t=String(text);map.slice().sort((a,b)=>b[0].length-a[0].length).forEach(([code,n])=>{t=t.split(code).join(n);const bare=code.slice(1,-1);t=t.split(bare).join(n)});return t}
function lenientJSON(src,start){
  const Q='"\u201C\u201D\u201E\u201F\uFF02\u300C\u300D';let i=start;const n=src.length;
  const ws=()=>{while(i<n&&/[\s,，、\u00A0]/.test(src[i]))i++};
  const isQ=c=>c&&'"\u201C\u201D\u201E\u201F\uFF02'.includes(c);
  const nextNon=k=>{while(k<n&&/[\s\u00A0]/.test(src[k]))k++;return src[k]};
  function str(){const open=src[i++];let out="";
    while(i<n){const c=src[i];
      if(c==="\\"&&i+1<n){const d=src[i+1];out+=({n:"\n",t:"\t",r:"",'"':'"',"\\":"\\","/":"/"})[d]??d;i+=2;continue}
      if(isQ(c)){const nx=nextNon(i+1);if(nx===undefined||/[,:：，}\]]/.test(nx)||isQ(nx)||(open==="\u300C"&&false)){i++;return out}}
      out+=c;i++}
    return out}
  function bare(){let s="";while(i<n&&!/[,:：，}\]\n]/.test(src[i]))s+=src[i++];s=s.trim();
    if(s==="true")return true;if(s==="false")return false;if(s==="null")return null;if(s!==""&&!isNaN(+s))return +s;return s}
  function val(){ws();const c=src[i];if(c==="{")return obj();if(c==="[")return arr();if(isQ(c))return str();return bare()}
  function obj(){i++;const o={};for(;;){ws();if(i>=n||src[i]==="}"){i++;return o}
    const k=isQ(src[i])?str():(()=>{let s="";while(i<n&&!/[:：}\s]/.test(src[i]))s+=src[i++];return s})();
    while(i<n&&/[\s\u00A0]/.test(src[i]))i++;if(src[i]===":"||src[i]==="："){i++}
    o[k]=val()}}
  function arr(){i++;const a=[];for(;;){ws();if(i>=n||src[i]==="]"){i++;return a}if(src[i]==="}"){return a}a.push(val())}}
  return obj()}

function parseJSONLoose(s){
  const raw=String(s).replace(/```(?:json|JSON)?/g,"");
  const m=raw.replace(/[\u201C\u201D\u201E\u201F\uFF02]/g,'"').replace(/\u00A0/g," ");
  const b=m.lastIndexOf("}");
  if(b>=0)for(let a=m.indexOf("{");a>=0&&a<b;a=m.indexOf("{",a+1)){const c=m.slice(a,b+1);for(const t of [c,c.replace(/,\s*([}\]])/g,"$1")]){try{const v=JSON.parse(t);if(v&&typeof v==="object"&&!Array.isArray(v))return v}catch(e){}}}
  const a=raw.indexOf("{");
  if(a>=0){try{const v=lenientJSON(raw,a);if(v&&typeof v==="object"&&Object.keys(v).length)return v}catch(e){}}
  throw{code:"invalid_json"}}

async function callAPI(text,signal){
  const st=settings(),p=st.provider,key=getKey(p),model=(st.models&&st.models[p])||PROVIDERS[p].model;
  if(!key)throw{code:"no_key"};
  let r;
  try{
    if(p==="openai")r=await fetch("https://api.openai.com/v1/chat/completions",{method:"POST",signal,headers:{"content-type":"application/json","authorization":"Bearer "+key},body:JSON.stringify({model,messages:[{role:"user",content:text}],temperature:.4})});
    else if(p==="anthropic")r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",signal,headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model,max_tokens:2500,messages:[{role:"user",content:text}]})});
    else r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{method:"POST",signal,headers:{"content-type":"application/json","x-goog-api-key":key},body:JSON.stringify({contents:[{parts:[{text}]}]})});
  }catch(e){if(e&&e.name==="AbortError")throw{code:"cancelled"};throw{code:"network"}}
  if(r.status===401||r.status===403)throw{code:"auth"};
  if(r.status===404||r.status===400)throw{code:"model"};
  if(r.status===429)throw{code:"rate"};
  if(!r.ok)throw{code:"network"};
  const j=await r.json();
  const out=p==="openai"?j.choices?.[0]?.message?.content:p==="anthropic"?(j.content||[]).map(c=>c.text||"").join(""):(j.candidates?.[0]?.content?.parts||[]).map(x=>x.text||"").join("");
  if(!out)throw{code:"refused"};return out}

function streakInfo(){
  const days=new Set(entries().map(e=>e.date));let n=0;const d=new Date();
  if(!days.has(today()))d.setDate(d.getDate()-1);
  while(days.has(`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`)){n++;d.setDate(d.getDate()-1)}
  return{days,streak:n,todayDone:days.has(today())}}
function homeCalendar(){
  const {days,streak,todayDone}=streakInfo();if(!entries().length)return "";
  const cells=[];const end=new Date();const start=new Date();start.setDate(end.getDate()-7*12+1-((end.getDay()+6)%7)+((end.getDay()+6)%7));
  const s=new Date();s.setDate(s.getDate()-83);s.setDate(s.getDate()-((s.getDay()+6)%7));
  for(let d=new Date(s);d<=end;d.setDate(d.getDate()+1)){const k=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;cells.push(`<i class="${days.has(k)?"on":""}${k===today()?" today":""}" title="${k}"></i>`)}
  return `<div class="card stack"><div class="spread"><h2 style="font-size:20px">寫作日曆</h2><span class="small ${todayDone?"":"muted"}">${todayDone?"今天寫了":"今天還沒寫"}${streak>1?` · 連續 ${streak} 天`:""}</span></div>

  return [e.talk&&`談了什麼：${e.talk}`,e.said&&`諮商師說：${e.said}`,e.insight&&`我的領悟：${e.insight}`,e.homework&&`回家作業：${e.homework}`,e.next&&`下次想談：${e.next}`].filter(Boolean).join("\n")}
function themeStats(){
  return themes().map(t=>{const es=entriesOfTheme(t.id);return{t,n:es.length,last:es[0]?.date||""}}).sort((a,b)=>b.n-a.n)}

function render(){
  $$("[data-view]").forEach(b=>b.dataset.view===view?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current"));
  if(mode==="loading"){$("#main").innerHTML=`<p class="loading">正在打開你的心路……</p>`;return}
  const html={home:vHome,log:vLog,map:vMap,people:vPeople,methods:vMethods,about:vAbout}[view]();
  const keepScroll=window.scrollY;
  $("#main").innerHTML=html+vFoot();
  if(view==="map"&&mapMode==="net")mountGraph();
  window.scrollTo(0,keepScroll);
}

function mediaChip(e){const ms=e.media||[];if(!ms.length)return "";const ni=ms.filter(m=>m.kind==="image").length,na=ms.length-ni;return `<span class="chip s">${[ni?`照片 ${ni}`:"",na?`錄音 ${na}`:""].filter(Boolean).join(" · ")}</span>`}

/* ---------------- people ---------------- */
function vPeople(){
  const ps=people();
  const byStage=s=>ps.filter(p=>(p.stages||[]).includes(s));
  const none=ps.filter(p=>!(p.stages||[]).length);
  const card=p=>{const n=entriesOfPerson(p.id).length;return `<button type="button" class="pcard" data-act="open-person" data-id="${p.id}"><span class="nm"><span class="av">${esc((p.name||"?").slice(0,1))}</span><span><b>${esc(p.name)}</b><br><span class="rel">${esc(p.relation||"")}</span></span></span><span class="meta">${n} 篇紀錄${p.ex?" · 範例":""}</span></button>`};
  const stages=peopleStage==="all"?STAGES:[peopleStage];
  return `<section class="view">${statusNote()}<div class="head spread"><div><h1>人物</h1><p class="muted">在你的生命裡，對你影響深的人。</p></div><button class="btn sm" data-act="new-person">新增人物</button></div>
  <div class="row">${["all",...STAGES].map(s=>`<button type="button" class="pick" data-act="pstage" data-s="${s}" aria-pressed="${peopleStage===s}">${s==="all"?"全部階段":s}</button>`).join("")}</div>
  ${ps.length?`<div class="stagegrid">${stages.map(s=>{const l=byStage(s);return `<div class="stage"><h3>${s}<span>${STAGE_HINT[s]} · ${l.length} 人</span></h3>${l.length?`<div class="pgrid">${l.map(card).join("")}</div>`:`<p class="small muted" style="margin-top:6px">還沒有這個階段的人物。</p>`}</div>`}).join("")}
   ${peopleStage==="all"&&none.length?`<div class="stage"><h3>還沒標記階段</h3><div class="pgrid">${none.map(card).join("")}</div></div>`:""}</div>`
   :`<div class="card"><p class="muted">還沒有人物。寫紀錄時可以直接新增，整理紀錄時 AI 也會找出文中提到的人。</p></div>`}

  return `<button type="button" class="weekcard" data-act="open-weekly"><span class="label" style="color:var(--method)">${isFresh(w.issue)?"本週":"最近一期"}心理學新知 · ${esc(w.issue)}</span><b>${esc(w.title||"這週的心理學研究")}</b>
   <span class="small muted">${w.items.slice(0,3).map(it=>esc(it&&it.title||"")).join("、")}</span></button>`}

function vJourney(){

     ${es.slice(0,6).map(e=>`<button type="button" class="mini-e" data-act="open-entry" data-id="${e.id}"><span>${fmtD(e.date)}</span>${esc(entryTitle(e))}</button>`).join("")}</div>`};
  const ts=themeStats();
  const col=([k,l])=>{const list=ts.filter(x=>(x.t.status||"facing")===k);
    return `<div class="bcol"><h3>${l} <span class="tiny muted">${list.length}</span></h3>${list.map(x=>`<div class="tcard"><div class="spread"><button class="linkbtn" data-act="open-theme" data-id="${x.t.id}"><b>${esc(x.t.name)}</b></button><span class="tiny muted">${x.n} 篇</span></div>

  <div class="stack"><h2 style="font-size:20px">諮商的歷程</h2>${ses.length?`<div class="tl">${ses.map(e=>`<button type="button" class="tli" data-act="open-entry" data-id="${e.id}"><b>第 ${e.no||"?"} 次 · ${esc(e.date||"")}</b><span>${esc(e.insight||e.talk||"")}</span></button>`).join("")}</div>`:'<p class="small muted">記錄諮商後，每一次都會排在這條路上。</p>'}</div>`}

function vFoot(){

/* ============================================================
   graph — a small force layout drawn in SVG
   ============================================================ */
let G=null;
function buildGraph(){
  const inStage=e=>mapStage==="all"||e.stage===mapStage||(e.people||[]).some(p=>(S.people.get(p)?.stages||[]).includes(mapStage));
  const es=entries().filter(inStage);
  const nodes=new Map(),links=new Map();
  const node=(id,type,label)=>{if(!nodes.has(id))nodes.set(id,{id,type,label,deg:0});return nodes.get(id)};
  const link=(a,b)=>{const k=a<b?a+"|"+b:b+"|"+a;const l=links.get(k)||{a,b,w:0};l.w++;links.set(k,l);nodes.get(a).deg++;nodes.get(b).deg++};
  es.forEach(e=>{
    const ps=(e.people||[]).filter(p=>S.people.has(p)).filter(p=>mapStage==="all"||(S.people.get(p).stages||[]).includes(mapStage)||e.stage===mapStage);
    const ts=(e.themes||[]).filter(t=>S.themes.has(t));
    ps.forEach(p=>node("p:"+p,"p",pName(p)));ts.forEach(t=>node("t:"+t,"t",tName(t)));
    const ms=steps().filter(s=>s.entryId===e.id).map(s=>s.methodId).filter(methodById);
    ms.forEach(m=>node("m:"+m,"m",methodById(m).name));
    if(showEntries){const en=node("e:"+e.id,"e",entryTitle(e));ps.forEach(p=>link(en.id,"p:"+p));ts.forEach(t=>link(en.id,"t:"+t));ms.forEach(m=>link(en.id,"m:"+m))}
    else{ps.forEach(p=>ts.forEach(t=>link("p:"+p,"t:"+t)));
      ms.forEach(m=>{(ts.length?ts.map(t=>"t:"+t):ps.map(p=>"p:"+p)).forEach(x=>link("m:"+m,x))});
      if(!ts.length&&ps.length>1)for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++)link("p:"+ps[i],"p:"+ps[j])}
  });
  if(mapStage==="all")people().forEach(p=>node("p:"+p.id,"p",p.name));
  return{nodes:[...nodes.values()],links:[...links.values()]}}
const NS="http://www.w3.org/2000/svg";
const radius=n=>n.type==="e"?5:(n.type==="t"?10:n.type==="p"?9:7)+Math.sqrt(n.deg)*3.2;
const color=t=>({p:"var(--person)",t:"var(--theme)",m:"var(--method)",e:"var(--entry)"})[t];
function mountGraph(){
  const svg=$("#graph"),wrap=$("#mapwrap");if(!svg)return;
  const {nodes,links}=buildGraph();
  const W=wrap.clientWidth,H=wrap.clientHeight;
  if(G&&G.raf)cancelAnimationFrame(G.raf);
  if(!nodes.length){svg.innerHTML="";wrap.insertAdjacentHTML("beforeend",`<p class="muted small" style="position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px">寫下紀錄並整理之後，人物、課題和方法會在這裡連成一張網。</p>`);renderPanel();return}
  const prev=G&&G.pos||new Map();
  nodes.forEach((n,i)=>{const p=prev.get(n.id);const a=i/nodes.length*Math.PI*2;n.x=p?p.x:W/2+Math.cos(a)*Math.min(W,H)*.3+(Math.random()-.5)*20;n.y=p?p.y:H/2+Math.sin(a)*Math.min(W,H)*.3+(Math.random()-.5)*20;n.vx=0;n.vy=0;n.r=radius(n)});
  const byId=new Map(nodes.map(n=>[n.id,n]));links.forEach(l=>{l.s=byId.get(l.a);l.t=byId.get(l.b)});
  const view=G&&G.view||{x:0,y:0,k:1},fitted=!!(G&&G.fitted&&prev.size);
  G={nodes,links,byId,W,H,view,alpha:prev.size?.3:1,pos:new Map(),raf:0,drag:null,fitted};
  svg.innerHTML="";svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const g=document.createElementNS(NS,"g");svg.appendChild(g);G.g=g;
  const lg=document.createElementNS(NS,"g"),ng=document.createElementNS(NS,"g");g.append(lg,ng);
  const maxW=Math.max(1,...links.map(l=>l.w));
  links.forEach(l=>{const el=document.createElementNS(NS,"line");el.setAttribute("stroke","var(--muted)");el.setAttribute("stroke-opacity",String(.18+.4*l.w/maxW));el.setAttribute("stroke-width",String(1+2.6*l.w/maxW));el.setAttribute("stroke-linecap","round");lg.appendChild(el);l.el=el});
  nodes.forEach(n=>{const el=document.createElementNS(NS,"g");el.style.cursor="pointer";el.dataset.id=n.id;
    const c=document.createElementNS(NS,"circle");c.setAttribute("r",n.r);c.setAttribute("fill",color(n.type));c.setAttribute("fill-opacity",n.type==="e"?".6":".92");
    if(n.type==="t"){c.setAttribute("stroke","var(--surface)");c.setAttribute("stroke-width","3")}
    el.appendChild(c);
    if(n.type!=="e"||showEntries&&nodes.length<40){const t=document.createElementNS(NS,"text");t.setAttribute("class","nlabel"+(n.type==="t"&&n.deg>2?" big":""));t.setAttribute("text-anchor","middle");t.setAttribute("dy",String(n.r+15));t.textContent=n.label.length>12?n.label.slice(0,12)+"…":n.label;el.appendChild(t)}
    ng.appendChild(el);n.el=el;n.circle=c});
  applyView();highlight();
  const tick=()=>{step();draw();G.alpha*=.972;if(G.alpha>.02||G.drag)G.raf=requestAnimationFrame(tick);else{G.raf=0;nodes.forEach(n=>G.pos.set(n.id,{x:n.x,y:n.y}));if(!G.fitted){G.fitted=true;fit()}}};
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){for(let i=0;i<300;i++){step();G.alpha*=.985}draw();nodes.forEach(n=>G.pos.set(n.id,{x:n.x,y:n.y}));fit()}else G.raf=requestAnimationFrame(tick);
  G.kick=()=>{G.alpha=Math.max(G.alpha,.4);if(!G.raf)G.raf=requestAnimationFrame(tick)};
  bindGraph(svg);renderPanel();
}
function step(){
  const {nodes,links,W,H}=G,a=G.alpha;
  for(let i=0;i<nodes.length;i++){const n=nodes[i];for(let j=i+1;j<nodes.length;j++){const m=nodes[j];let dx=n.x-m.x,dy=n.y-m.y,d2=dx*dx+dy*dy||.01;const d=Math.sqrt(d2);const min=n.r+m.r+18;
    let f=3600/d2;if(d<min)f+=(min-d)*.08;dx/=d;dy/=d;n.vx+=dx*f*a;n.vy+=dy*f*a;m.vx-=dx*f*a;m.vy-=dy*f*a}}
  links.forEach(l=>{const s=l.s,t=l.t;let dx=t.x-s.x,dy=t.y-s.y,d=Math.sqrt(dx*dx+dy*dy)||.01;const len=110+(s.r+t.r);const k=.03*Math.min(3,Math.sqrt(l.w))*(d-len)/d;
    s.vx+=dx*k*a;s.vy+=dy*k*a;t.vx-=dx*k*a;t.vy-=dy*k*a});
  nodes.forEach(n=>{n.vx+=(W/2-n.x)*.004*a;n.vy+=(H/2-n.y)*.004*a;if(n.fixed){n.vx=n.vy=0;return}n.vx*=.6;n.vy*=.6;n.x+=n.vx;n.y+=n.vy})}
function draw(){G.links.forEach(l=>{l.el.setAttribute("x1",l.s.x);l.el.setAttribute("y1",l.s.y);l.el.setAttribute("x2",l.t.x);l.el.setAttribute("y2",l.t.y)});G.nodes.forEach(n=>n.el.setAttribute("transform",`translate(${n.x},${n.y})`))}
function fit(){if(!G||!G.nodes.length)return;let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;G.nodes.forEach(n=>{x0=Math.min(x0,n.x-n.r-40);x1=Math.max(x1,n.x+n.r+40);y0=Math.min(y0,n.y-n.r-10);y1=Math.max(y1,n.y+n.r+30)});
  const k=Math.min(2.2,Math.max(.4,Math.min(G.W/(x1-x0),G.H/(y1-y0))));G.view={k,x:G.W/2-(x0+x1)/2*k,y:G.H/2-(y0+y1)/2*k};G.g.style.transition='transform .6s';applyView();setTimeout(()=>{if(G&&G.g)G.g.style.transition=''},700)}
function applyView(){const v=G.view;G.g.setAttribute("transform",`translate(${v.x},${v.y}) scale(${v.k})`)}
function highlight(){
  if(!G)return;const sel=selNode&&G.byId.get(selNode);const nb=new Set();
  if(sel){nb.add(sel.id);G.links.forEach(l=>{if(l.s===sel)nb.add(l.t.id);if(l.t===sel)nb.add(l.s.id)})}
  G.nodes.forEach(n=>{n.el.style.opacity=!sel||nb.has(n.id)?"1":".18";n.circle.setAttribute("stroke",sel&&n===sel?"var(--ink)":n.type==="t"?"var(--surface)":"none");n.circle.setAttribute("stroke-width",sel&&n===sel?"2.5":n.type==="t"?"3":"0")});
  G.links.forEach(l=>l.el.style.opacity=!sel||l.s===sel||l.t===sel?"1":".08")}
function bindGraph(svg){
  const pt=e=>{const r=svg.getBoundingClientRect(),v=G.view;return{x:((e.clientX-r.left)*G.W/r.width-v.x)/v.k,y:((e.clientY-r.top)*G.H/r.height-v.y)/v.k,sx:e.clientX,sy:e.clientY}};
  svg.onpointerdown=e=>{const ge=e.target.closest("g[data-id]");const p=pt(e);svg.setPointerCapture(e.pointerId);
    if(ge){const n=G.byId.get(ge.dataset.id);G.drag={n,moved:false,sx:p.sx,sy:p.sy};n.fixed=true}
    else G.drag={pan:true,sx:e.clientX,sy:e.clientY,vx:G.view.x,vy:G.view.y,moved:false};svg.classList.add("dragging")};
  svg.onpointermove=e=>{const d=G.drag;if(!d)return;
    if(Math.abs(e.clientX-d.sx)+Math.abs(e.clientY-d.sy)>4)d.moved=true;
    if(d.pan){const r=svg.getBoundingClientRect();G.view.x=d.vx+(e.clientX-d.sx)*G.W/r.width;G.view.y=d.vy+(e.clientY-d.sy)*G.H/r.height;applyView()}
    else if(d.moved){const p=pt(e);d.n.x=p.x;d.n.y=p.y;G.kick()}};
  svg.onpointerup=e=>{const d=G.drag;G.drag=null;svg.classList.remove("dragging");if(!d)return;
    if(d.n){d.n.fixed=false;if(!d.moved){selNode=selNode===d.n.id?null:d.n.id;highlight();renderPanel()}}
    else if(!d.moved&&selNode){selNode=null;highlight();renderPanel()}};
  svg.onwheel=e=>{e.preventDefault();zoomAt(e.deltaY<0?1.12:.89,e)};
}
function zoomAt(f,e){const svg=$("#graph");if(!G||!svg)return;
  if(f===0){fit();return}
  const r=svg.getBoundingClientRect(),cx=e?(e.clientX-r.left)*G.W/r.width:G.W/2,cy=e?(e.clientY-r.top)*G.H/r.height:G.H/2,v=G.view;

function renderPanel(){
  const el=$("#nodePanel");if(!el)return;
  if(!selNode||!G||!G.byId.get(selNode)){el.innerHTML=G&&G.nodes&&G.nodes.length?`<span class="maphint">點一個點，看它連到什麼</span>`:"";return}
  const n=G.byId.get(selNode),[type,id]=[n.type,n.id.slice(2)];
  let es=[],extra="";
  if(type==="p"){es=entriesOfPerson(id);const p=S.people.get(id);extra=`<p class="small muted">${esc(p?.relation||"")}${(p?.stages||[]).length?" · "+p.stages.join("、"):""}</p><div class="row"><button class="btn sm quiet" data-act="open-person" data-id="${id}">看這個人</button></div>`}
  if(type==="t"){es=entriesOfTheme(id);const t=S.themes.get(id);extra=`<p class="small muted">狀態：${(TSTATUS.find(s=>s[0]===(t?.status||"facing"))||[])[1]}</p><div class="row"><button class="btn sm quiet" data-act="open-theme" data-id="${id}">看這個課題</button><button class="btn sm ghost" data-act="open-method" data-id="c_pattern">把重複的模式擺在一起</button></div>`}
  if(type==="m"){const ids=new Set(steps().filter(s=>s.methodId===id).map(s=>s.entryId));es=entries().filter(e=>ids.has(e.id));extra=`<div class="row"><button class="btn sm quiet" data-act="open-method" data-id="${id}">看這個方法</button></div>`}
  if(type==="e"){es=[S.entries.get(id)].filter(Boolean)}
  el.innerHTML=`<div class="panel"><div class="spread"><h3 style="font-size:19px;color:${color(type)}">${esc(n.label)}</h3><span class="row"><span class="tiny muted">${{p:"人物",t:"課題",m:"方法",e:"紀錄"}[type]}</span><button class="btn sm ghost" data-act="unsel" aria-label="關閉">×</button></span></div>${extra}
   <div class="stack">${es.slice(0,12).map(e=>`<button type="button" class="mini-e" data-act="open-entry" data-id="${e.id}"><span>${fmtD(e.date)}</span>${esc(entryTitle(e))}</button>`).join("")||'<p class="small muted">還沒有相關紀錄。</p>'}</div></div>`}

function tearRitual(text,done){

  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  setTimeout(()=>{const pp=r.querySelector(".paper");if(pp)pp.classList.add("torn")},reduce?0:700);

async function readFileText(f){
  const buf=new Uint8Array(await f.arrayBuffer());
  if(buf[0]===0xFF&&buf[1]===0xFE)return new TextDecoder("utf-16le").decode(buf);
  if(buf[0]===0xFE&&buf[1]===0xFF)return new TextDecoder("utf-16be").decode(buf);
  try{return new TextDecoder("utf-8",{fatal:true}).decode(buf)}catch(e){}
  try{return new TextDecoder("big5").decode(buf)}catch(e){return new TextDecoder("utf-8").decode(buf)}}
const DRE=/^\s*[-–—•*·]*\s*[\[(（【〔]?\s*(?:民國\s*)?(\d{2,4})\s*[\/\-.．年]\s*(\d{1,2})\s*[\/\-.．月]\s*(\d{1,2})\s*[日號]?\s*[\])）】〕]?\s*\s*(?:[（(]\s*(?:星期|週|周|禮拜)?[一二三四五六日天]\s*[）)]|(?:星期|週|周|禮拜)[一二三四五六日天])?/;
function toISO(y,m,d){y=+y;m=+m;d=+d;if(y<1000)y+=1911;if(m<1||m>12||d<1||d>31||y<1950||y>2100)return null;return `${y}-${pad(m)}-${pad(d)}`}

function parseDiary(text,fallback,fname){
  const lines=text.replace(/\r\n?/g,"\n").split("\n");const out=[];let cur=null;
  const push=()=>{if(!cur)return;cur.text=cur.lines.join("\n").trim();delete cur.lines;if(!cur.text&&cur.title){cur.text=cur.title;cur.title=""}if(cur.text)out.push(cur)};
  for(const ln of lines){const m=ln.match(DRE);const iso=m&&toISO(m[1],m[2],m[3]);
    if(iso){push();const rest=ln.slice(m[0].length).replace(/^[\s:：,，、\-—]+/,"").trim();
      cur={date:iso,title:rest.length<=30?rest:"",lines:rest.length>30?[rest]:[],file:fname,dated:true}}
    else{if(!cur)cur={date:fallback,title:"",lines:[],file:fname,dated:false};cur.lines.push(ln)}}
  push();return out}

const CHUNK=200000,MAX_AUDIO=3*1024*1024,MAX_PHOTOS=8;
const mediaCache=new Map();
const canMedia=()=>mode==="device";
async function putMedia(meta,dataUrl){meta.n=1;await IDB.set("media",meta.id,dataUrl);mediaCache.set(meta.id,dataUrl);return meta}
async function getMedia(meta){if(mediaCache.has(meta.id))return mediaCache.get(meta.id);if(mode!=="device")throw{code:"local"};const u=await IDB.get("media",meta.id);if(!u)throw{code:"missing"};mediaCache.set(meta.id,u);return u}
async function delMedia(meta){mediaCache.delete(meta.id);if(mode==="device"){try{await IDB.del("media",meta.id)}catch(e){}}}
function compressImage(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{URL.revokeObjectURL(u);let max=1600,q=.82,out="",w=0,h=0;
    for(let k=0;k<8;k++){const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));w=Math.max(1,Math.round(img.naturalWidth*sc));h=Math.max(1,Math.round(img.naturalHeight*sc));
      const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);out=c.toDataURL("image/jpeg",q);
      if(out.length<=600000)break;if(q>.6)q-=.1;else max=Math.round(max*.8)}
    res({url:out,w,h})};
  img.onerror=()=>{URL.revokeObjectURL(u);rej({code:"decode"})};img.src=u})}
function readDataURL(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result));r.onerror=()=>rej({code:"read"});r.readAsDataURL(file)})}
function mediaProg(t){const p=$("#mediaProg");if(p)p.textContent=t}
async function addFiles(files,kind){
  if(!canMedia()){toast("這個瀏覽器無法儲存照片和錄音。");return}
  const d=sheet.draft;d.media=d.media||[];sheet.newMedia=sheet.newMedia||[];
  for(const f of files){
    if(kind==="image"&&d.media.filter(m=>m.kind==="image").length>=MAX_PHOTOS){toast(`一篇最多 ${MAX_PHOTOS} 張照片`);break}
    if(kind==="audio"&&f.size>MAX_AUDIO){toast(`「${f.name}」超過 3 MB，請剪短一點再加入。`);continue}
    const meta={id:uid(),kind,name:f.name||"",at:Date.now()};
    mediaProg(`正在加入 ${f.name||(kind==="image"?"照片":"錄音")}……`);
    try{
      if(kind==="image"){const r=await compressImage(f);meta.mime="image/jpeg";meta.w=r.w;meta.h=r.h;await putMedia(meta,r.url)}
      else{const u=await readDataURL(f);if(!/^data:audio\//.test(u)){toast(`「${f.name}」不是錄音檔`);continue}meta.mime=u.slice(5,u.indexOf(";"));meta.size=f.size;await putMedia(meta,u)}
      if(!sheet||sheet.kind!=="edit"){delMedia(meta);break}
      d.media.push(meta);sheet.newMedia.push(meta);sheet.dirty=true;
    }catch(e){toast(e&&e.code==="quota_exceeded"?"雲端空間已滿，請先刪除一些照片或錄音。":e&&e.code==="decode"?"這張照片讀不出來，請換成 JPG 或 PNG。":"加入沒有成功，請再試一次。")}
  }
  mediaProg("");renderDraftMedia()}
function mediaThumbs(list,editable){
  return (list||[]).map(m=>m.kind==="image"
    ?`<div class="mthumb"><button type="button" class="mimg" data-act="view-photo" data-mid="${esc(m.id)}" aria-label="放大照片"><img data-mid="${esc(m.id)}" alt="${esc(m.name||"照片")}"></button>${editable?`<button type="button" class="mx" data-act="rm-media" data-mid="${esc(m.id)}" aria-label="移除這張照片">×</button>`:""}</div>`
    :`<div class="maudio"><span class="small muted">${esc(m.name||"錄音")}</span><audio controls preload="none" data-mid="${esc(m.id)}"></audio>${editable?`<button type="button" class="mx" data-act="rm-media" data-mid="${esc(m.id)}" aria-label="移除這段錄音">×</button>`:""}</div>`).join("")}
function hydrateMedia(scope,list){(list||[]).forEach(m=>{const els=$$("img,audio",scope).filter(el=>el.dataset.mid===m.id);if(!els.length)return;
  getMedia(m).then(u=>els.forEach(el=>{el.src=u})).catch(()=>els.forEach(el=>{if(el.tagName==="IMG")el.alt="照片讀取失敗"}))})}
